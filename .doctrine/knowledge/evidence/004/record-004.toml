datum = "modelcontextprotocol.io specification/2026-07-28 (changelog, server/discover, basic/versioning, basic/transports/stdio) and ext-tasks schema/2026-07-28/schema.ts, read 2026-10-26. 2026-07-28 removes initialize/notifications/initialized and ping; every request carries _meta io.modelcontextprotocol/protocolVersion and clientCapabilities; servers MUST implement server/discover {resultType, supportedVersions, capabilities{extensions}, instructions, _meta serverInfo, ttlMs, cacheScope}; unsupported version -> error -32022 {supported, requested}; all results carry resultType ('complete'); list results carry ttlMs and cacheScope; a dual-era server MAY serve initialize (legacy) and per-request _meta (modern) in one process; stdio clients probe with server/discover and fall back to initialize on any non-modern error. notifications/cancelled remains the stdio cancel. Tasks extension io.modelcontextprotocol/tasks: CreateTaskResult = Result & Task & {resultType:'task'}, Task {taskId, status working|input_required|completed|failed|cancelled, statusMessage?, createdAt, lastUpdatedAt, ttlMs (int|null), pollIntervalMs?}; tasks/get {taskId} -> DetailedTask + resultType 'complete' (completed carries result = original request's result; failed carries JSON-RPC error); tasks/update {taskId, inputResponses} and tasks/cancel {taskId} -> empty ack; cancellation cooperative; task durably created before the response; server must not return a task unless the request declared the extension; notifications/tasks optional via subscriptions/listen. SEP-2663 (tasks extension, Final), read 2026-10-26: the 2025-11-25 per-tool execution.taskSupport handshake and the task parameter on CallToolRequest are removed (servers MUST ignore task); the tasks.requests capability declarations are not part of the extension; the extension capability in per-request clientCapabilities is the single handshake, and the server decides per request whether to materialise a task. ext-tasks schema/2026-07-28 defines no Tool, execution or taskSupport member; CompletedTask.result matches the result type of the original request; the protocol schema types -32022 data.requested as a string."

slug = "project-forms-run-only-when-operator-approved-by-identity"
title = "Project forms run only when operator-approved by identity"
record_kind = "decision"
status = "accepted"
created = "2026-10-24"
updated = "2026-10-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-007 lets a project supply forms. A form is the confinement; anyone who can write the repo (delegates; the unconfined orchestrator; commits) could otherwise shape the next delegate's jail. nix-direnv rebuilds closures on flake edits without asking."
choice = "The operator's approval is the selection. A call governed by an approval entry (the deepest approval for its capability whose recorded root contains the call's canonical root; DEC-007) must use exactly the approved form: admission resolves <approval root>/.quotient/forms/<cap> once to its real path; checks real path + sha256 against the entry; and the call execs that resolved path. Missing link or changed identity refuses (form-invalid / form-unapproved) — never falls back to the machine default. An ungoverned call with a link at its roots entry refuses form-unapproved. Only an ungoverned call with no link uses the machine default. Revocation is an operator verb (DEC-009). The selected form never changes mid-call; a launch that fails (deleted; garbage-collected) ends failed with no fallback. .quotient/ is not a protected store."
alternatives = ["approve the source (.quotient/ declaration) and trust the flake transitively as direnv does", "protect flake.nix/flake.lock/.quotient from delegate writes", "form-side masking of .quotient inside writable roots", "fall back to machine defaults when the project link disappears (rejected: a delegate could downgrade confinement by deleting it)"]
rationale = "Gating the built output is exact and backend-agnostic (nix+bwrap; seatbelt; other); quotient needs no Nix knowledge. Source approval would let a delegate edit flake inputs and run in the jail it wrote after the next rebuild. Protecting build inputs is unenumerable and blocks legitimate dependency edits. Matches harness behaviour: a rebuild never alters work in flight."
consequences = ["re-approval whenever a form's identity changes", "forms should carry a narrow stable toolchain to limit re-approval", "ISS-001 refusal disappears because .quotient is no longer fenced", "new refusal reasons form-invalid and form-unapproved", "deleting project links does not revert to defaults: the operator revokes", "for non-store paths the hash pins only the executable itself"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


[facet]                         # every field typed; seeded empty (captured later)
context = "Users want explicitly sequential runs with order preserved, and stop-on-failure without a race."
choice = "start/pi_agent take lane?: a name (session-id grammar); naming a lane is the only opt-in. Per lane FIFO, at most one executing; the next launches when the previous settles. needs_success: true on a run makes it refuse without launching (reason lane-predecessor-failed) when its lane predecessor settled other than completed; this cascades. Admission at start (policy, profile, cwd, ceilings, session lock); the policy is re-read at launch and a refusal then settles the run as refused. Wall clock from launch. Lanes are per server process."
alternatives = ["A sequential boolean with one default lane", "Lane-level halt mode", "Dependencies between named runs (after: [run])", "Orchestrator wait-then-cancel (races: the next run launches first)"]
rationale = "The decision must be taken server-side at settlement or the next run starts before a cancel can land; a per-run flag composes in mixed lanes with no resume verb."
consequences = ["result/2 gains one refusal reason row", "completed with a failing answer is not failure to a lane; judgement between steps means not queueing ahead"]

[facet]                         # every field typed; seeded empty (captured later)
context = "jail.nix is not a quotient input (DEC-016), so quotient's own checks need a separate flake. The text check cannot see runtime behaviour. v0.3.0 shipped broken on Nix (operator, 2026-10-24)."
choice = "(1) nix/checks/flake.nix with its own lock (nixpkgs, jail-nix, quotient as path:../..): a default and a full sample family (persistHome, exposure, protect, secretEnv, piFiles, network=false) built with a stub pi must pass checkFormFamily; doctored copies must fail nix/check.sh with the expected rule label (negative controls, one per refusal; launcher-level faults made by a doctor helper that copies form and launcher and repoints the form's exec). (2) scripts/form-probe: a probe family with the full sample options whose pi is a probe script, run directly on the host over a fixed tree /tmp/quotient-form-probe (a root with an exposure inside it, an exposure outside it, persisted home, a world bound read-only holding the XDG state dir, an existing and a missing protect path, a ro host dir), a canary env var and a known secret; asserts by real write attempts, not test -w: G1, G2 per capability, G3, G4, exposure writable, piFiles and a non-exposed host path not writable (G5 sample), launch succeeds with a protect path missing under a ro bind, the exposure inside the root refused under read and writable under write (G2 over G5), the quotient state directory and a protect path unreadable apart from this session dir (G6), canary absent from /proc/1/environ, secretEnv value absent from /proc/1/cmdline, SIGKILL of the form's parent leaves no jailed process (G7), missing session dir exits 64 (G8). (3) hostile-audit against a real-pi family for both capabilities, once (VH). (4) shellcheck covers nix/check.sh and scripts/form-probe. (5) Docs: docs/nix-forms.md (including the caller's responsibilities: --args/add-runtime binds, the shared-temp pattern), README forms bullet + link, help/setup.md step 3, flake.nix comment, quotient-policy-2.md worktree wording. (6) just forms-check (nix flake check -L) and just forms-probe join just gate."
alternatives = ["sample family in the main flake checks (needs a jail-nix input)", "manual-only behavioural verification", "forms recipes outside the gate"]
rationale = "A script probe covers runtime guarantees without a model; gating on Nix catches the class of break that reached v0.3.0."
consequences = ["the gate needs Nix and bwrap with user namespaces (Linux)", "form-probe runs on the host, not in the Nix build sandbox"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


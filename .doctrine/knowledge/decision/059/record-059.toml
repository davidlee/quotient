[facet]                         # every field typed; seeded empty (captured later)
context = "Task requires createdAt, lastUpdatedAt and ttlMs (int|null); pollIntervalMs is optional (EVD-004). Results persist to result.json and survive restarts (DEC-049)."
choice = "ttlMs: null (retention is the evidence dir's, not the server's). createdAt and lastUpdatedAt come from the run record, or from the evidence dir after a restart. pollIntervalMs: 2000."
alternatives = ["A finite ttlMs with expiry"]
rationale = "quotient never expires a result it can read from disk; a fixed poll hint is enough for runs measured in minutes."
consequences = ["The evidence dir must yield both timestamps after a restart"]

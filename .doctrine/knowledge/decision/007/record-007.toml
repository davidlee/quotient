updated = "2026-10-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "ISS-001: the launch-dir .quotient profile/help layer fences repo roots from write calls. Triage chose one policy per project via QUOTIENT_POLICY; SL-002 research showed a policy-named layer conflicts with the start-up snapshot. The operator wants no per-project env and wants confinement defined with the project whose dependencies it carries."
choice = "Split the policy by job. The machine policy (~/.config/quotient) holds the grant (roots; profile capability pins; exposure; enabled/mode) and the limits (maxima; transcript budget) plus default forms. Profiles and help are machine-only. A project supplies only forms; in <root>/.quotient/ where <root> is the policy roots entry containing the call cwd (longest match). Absent .quotient/ means the machine default forms apply."
alternatives = ["one policy per project selected by QUOTIENT_POLICY", "policy-named profile/help layers (profile_layers field)", "QUOTIENT_PROFILES/QUOTIENT_HELP env vars", "keep launch-dir layers with form-side masking (ISS-001 option 2)"]
rationale = "Grants and limits vary by operator and machine and must not be self-admitted from a project tree; confinement mechanism depends on project dependencies and belongs with them. Keying forms by root lets one server serve every project without per-project env."
consequences = ["launch-dir profile/help layers removed", "forms keyed by root (reverses ISS-001 triage)", "a project may not name the unconfined form", "roots stay central so no directory admits itself", "server finding a legacy launch-dir .quotient/profiles or help fails start-up with migration guidance"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


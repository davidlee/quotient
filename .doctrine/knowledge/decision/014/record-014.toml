choice = "The quotient flake gains optional Nix library functions: a form-family builder over jail.nix and a text-only check for it. quotient ships no default forms: packages stay the server only, the npm package and src/ are unchanged, and a policy still names form paths. The flake.nix comment and the README forms bullet are reworded to say so."
alternatives = ["supersede DEC-116 (not a quotient entity; the contract-only stance stands)", "ship forms as packages outputs (quotient would choose a toolchain and provider)"]
rationale = "The blocker DEC-116 cited, a private dependency, is gone when the builder uses jail.nix directly; operators still choose and name forms."

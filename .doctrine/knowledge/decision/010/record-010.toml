slug = "project-forms-substitute-the-executable-of-a-machine-form-slot"
title = "Project forms substitute the executable of a machine form slot"
record_kind = "decision"
status = "accepted"
created = "2026-10-24"
updated = "2026-10-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-007 lets a project supply forms; SL-002 inq-2 and inq-3. A symlink cannot carry the policy form's extensions; an executable inside a writable path can be swapped between the admission hash and spawn."
choice = "<root>/.quotient/forms/{read;write}: each must resolve to an executable regular file whose real path lies outside every location a delegate can write under form-1 G5: every roots entry; every exposure path; and the session home. A project form replaces only the executable of a confined form slot the machine policy declares for that capability and inherits that slot's extensions; no machine slot means wrapper-unavailable as today; a project cannot express unconfined. The call executes the resolved real path. Looking up .quotient treats only ENOENT as absent; any other error refuses. Unusable project form refuses form-invalid; usable but unapproved or changed refuses form-unapproved. Quotient has no fallback to unconfined. Form publishing requirement (form-1): a form that cannot establish confinement exits non-zero; inputs critical to confinement (e.g. a seatbelt profile) MUST be inside the hashed executable or at a path no delegate can write."
alternatives = ["forms/<cap>/bin/ directory layout", "committed JSON naming paths and extensions", "exec through a held file descriptor"]
rationale = "Machine keeps the form interface (extensions are a grant-like property); project owns only the binary. Requiring the real path outside this policy's writable paths closes the swap race against this policy's delegates with no platform-specific machinery. Host-wide immutability of an approved form (against delegates still running under an older policy or under another server's policy) is the operator's obligation; as the contract already makes it for the policy file (RV-006 F-2); Nix store paths meet it. Backend-agnostic: a seatbelt form is just a script."
consequences = ["IMP-003 helper should emit single-file scripts (writeShellScript)", "two new refusal reasons form-invalid and form-unapproved", "the hash covers only the executable: confinement-critical inputs must be embedded or delegate-immutable", "hardlink/alias and /proc conformance remain the form's responsibility (G5; not verified by quotient)", "the outside-writable-paths check is a backstop against the current policy; an approved form must be immutable to every delegate on the host (operator obligation)", "broadening extension permissions is out of scope (IDE-002)"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


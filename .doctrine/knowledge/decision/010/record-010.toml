[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-007 lets a project supply forms; SL-002 inq-2 and inq-3. A symlink cannot carry the policy form's extensions; an executable inside a writable path can be swapped between the admission hash and spawn."
choice = "<root>/.quotient/forms/{read;write}: each must resolve to an executable regular file whose real path lies outside every roots entry and every exposure path. A project form replaces only the executable of a confined form slot the machine policy declares for that capability and inherits that slot's extensions; no machine slot means wrapper-unavailable as today; a project cannot express unconfined. The call executes the resolved real path. Unusable project form refuses form-invalid; usable but unapproved or changed refuses form-unapproved. Quotient has no fallback to unconfined; a form that cannot establish confinement must exit non-zero (form-1 clarification)."
alternatives = ["forms/<cap>/bin/ directory layout", "committed JSON naming paths and extensions", "exec through a held file descriptor"]
rationale = "Machine keeps the form interface (extensions are a grant-like property); project owns only the binary. Requiring the real path outside writable paths closes the swap race with no platform-specific machinery; Nix store paths satisfy it. Backend-agnostic: a seatbelt form is just a script."
consequences = ["IMP-003 helper should emit single-file scripts (writeShellScript)", "two new refusal reasons form-invalid and form-unapproved", "the hash covers only the executable: confinement config should be embedded or immutable", "broadening extension permissions is out of scope (IDE-002)"]

context = "SL-002 inq-4 and inq-8. DEC-004 forbids silently reinterpreting an old policy; research round 1 argued for quotient-policy/3 because the contract prose changes."
choice = "Keep quotient-policy/2 and edit its contract in place: no policy field changes and a /2 file keeps its meaning. The behaviour that breaks (launch-dir profile/help layers) fails loudly: if <launch dir>/.quotient/profiles or /help exists; start-up fails naming the path and saying to move its documents to <xdgConfig>/quotient/ and restart (every call refuses profile-invalid). 'quotient help' only warns. New refusal reasons are additive to pi-agent-result/2."
alternatives = ["mint quotient-policy/3", "silently ignore legacy layers"]
rationale = "A version bump would mark a change no policy document expresses; the start-up failure is the direct non-silent signal DEC-004 requires."
consequences = ["package minor version bump", "satan must move .quotient/profiles before upgrading"]

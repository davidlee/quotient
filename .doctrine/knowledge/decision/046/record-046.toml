id = 46
slug = "runs-are-server-held-records-keyed-by-their-evidence-run-name-settled-in-their-own-task-retained"
title = "Runs are server-held records keyed by their evidence run name, settled in their own task, retained until the server exits"
record_kind = "decision"
status = "superseded"
created = "2026-10-26"
updated = "2026-10-26"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "A run must outlive the call that started it, and its result must not be lost to an undelivered reply."
choice = "States queued -> running -> settled (a result/2 document); a refusal at start mints no run. Handle = the evidence run name, opaque to clients. In-memory registry for the server's life, no eviction (ASM-002). Reduce, transcript, status and result are committed when the run settles, in the run's own task. A run is acknowledged only when a caller names it in a wait's ack; sending a reply never marks it."
alternatives = ["Mark delivered on send (superseded: a reply can be lost to a client timeout)", "Commit at wait time", "Evict settled runs"]
rationale = "Over stdio the server cannot know a reply arrived, so only the caller can say it has a result."
consequences = ["delivery is at-least-once; callers dedupe by run handle"]
decided_by = "user"
decided_on = "2026-10-26"


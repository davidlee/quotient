[facet]                         # every field typed; seeded empty (captured later)
context = "Cancelling or shutting down must not let a lane launch a successor mid-sweep."
choice = "pi_agent_cancel marks every target cancelled first, then hands running runs to the one ladder (cause cancelled) and settles queued ones without launching (failed arm, audit record, session lock released), and answers once all settle. Lane advancement skips marked runs. EOF marks the server closing first: no lane advances; every running run is aborted (cause eof) and every queued run dropped with an audit record; no replies. notifications/cancelled on a start cancels admission only before the run record exists; after that the run stands and is found by key or listing. On pi_agent it cancels its run (as today); on wait it ends the wait only."
alternatives = ["Sequential cancel (races lane advance)", "Queued runs survive EOF"]
rationale = "Marks taken before any await close the advance window; one termination path remains."

id = 67
slug = "runs-record-their-owning-server-a-live-or-unknown-owner-reads-foreign-working-only-a-dead-owner"
title = "Runs record their owning server; a live or unknown owner reads foreign (working), only a dead owner reads lost (failed)"
record_kind = "decision"
status = "accepted"
created = "2026-10-26"
updated = "2026-10-26"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Every quotient server of a user shares one run dir. A server resolving another live server's handle on disk finds no result.json and, under the pre-reopening draft, calls it lost -> failed, a terminal status that would later change. session.ts already judges a process alive by pid plus kernel start time (observeLiveness: alive|stale|unknown)."
choice = "The admitted audit record carries the owning server's identity: pid, kernel start time, boot id, pid-namespace id and hostname. A run resolved on disk: valid result.json -> settled; a lost audit record (DEC-066) -> lost; no result and owner alive or unknown -> new state foreign, Task working, statusMessage naming the owner; owner stale -> lost -> failed. Only a confirmed-dead owner yields a terminal status. Liveness is judged only where pid and start time mean something: same hostname, boot id and pid namespace as the reader -> observeLiveness (alive|stale|unknown); same hostname and a different boot id -> stale (the owner's boot has ended); anything else, or any identity component missing on either side -> unknown (amended 2026-10-26 by the user, reply '2a': pid and start time identify a process only within one pid namespace, so a reader in another namespace or on another host sharing the run dir would otherwise read a live owner stale and report a terminal status that later changes). wait re-reads foreign runs from disk every pollIntervalMs so a result.json is seen when it lands. No cross-process cancellation: tasks/cancel on a foreign run is a no-op ack; pi_agent_cancel reports it foreign, not cancelled."
alternatives = ["A run without result.json is never terminal (lost runs poll forever)", "Signal the owning server to cancel"]
rationale = "Every terminal status is true; reuses the liveness check session locks already depend on."
consequences = ["Adds foreign to DEC-058's state extra and to DEC-057's mapping (foreign -> working)", "wait gains a disk-polling path for foreign runs", "the server reads its own boot id; pid namespace and hostname once at start-up"]
decided_by = "user"
decided_on = "2026-10-26"


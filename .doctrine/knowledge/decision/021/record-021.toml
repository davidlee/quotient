slug = "checkformfamily-is-a-text-only-check-over-a-single-level-family-with-negative-controls"
title = "checkFormFamily is a text-only check over a single-level family, with negative controls"
record_kind = "decision"
status = "accepted"
created = "2026-10-24"
updated = "2026-10-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "satan's quotient-forms check (flake.nix:691-) is text-only and compares each form's binds with a shared-generator baseline, but descends a two-level exec chain. A jail.nix-direct family has one level: form script execs the jail.nix launcher."
choice = """quotient.lib.checkFormFamily { pkgs, family } is a runCommand that reads scripts as text, launches nothing. family = { read, write, baseline, exposure, prefix, secretEnvNames, network, bwrap }. Per capability it asserts: (a) form script has the three guards with their predicates ($# check, absolute-path case, -d test) each on its exit 64 line and no other exit 64, session_dir=$1, shift, export QUOTIENT_ACTIVE_SESSION_DIR, exec <launcher> "$@", no --, no own bind flags; (b) launcher runs family.bwrap; (c) capability root flag present and the other absent, exactly one assignment to quotient_root (=$(pwd -P)) and one declaration quotient_mask=() with every += on a line opening with its [ -e ... ] && test, so no caller runtime code can reassign them; after the ${quotient_mask[@]} token only the root bind and the session bind, then --chdir "$quotient_root"; (d) --die-with-parent, --tmpfs /tmp, --clearenv, the --unshare-{user,ipc,pid,uts,cgroup} set, --unshare-net present exactly when family.network is false and then no raw --share-net, no other --chdir, no caller bind or tmpfs targeting exactly /tmp; (e) no --setenv QUOTIENT_*, no baseline bind targeting the root path; (f) form binds minus baseline binds = {root, session}, none dropped; (g) every baseline rw bind source in family.exposure; (h) no secretEnvNames as --setenv NAME, exec {quotient_secret_fd}< and --args "$quotient_secret_fd" at most once each, exactly once when secretEnv is non-empty; (i) quotient_mask is built from the default state dir and protect behind existence tests, and its expansion opens the tail. Reports every failure; prints residues; strips quotes once and folds store hashes. Bash in nix/check.sh (shellcheck-able). Negative controls are doctored families in quotient's test flake that must fail."""
alternatives = ["keep satan's two-level descent (no wrapper chain exists)", "a behavioural check in the build sandbox (bwrap needs user namespaces)"]
rationale = "Consumers get the same proof satan has, rebased to the new shape; hash folding keeps it stable across bumps."
consequences = ["out of scope: --args/add-runtime binds and runtime behaviour (hostile-audit, leak probe; VH)"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


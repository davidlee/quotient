[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-008 requires operator approval of project forms by identity; SL-002 inq-1 and inq-5."
choice = "Approvals live in <xdgConfig>/quotient/approvals.json (fixed path; no env var): one entry per (canonical roots entry; capability) holding real path + sha256 + approved_at. 'quotient allow [<path>]' (path defaults to cwd) only reports: per form the link; real path; sha256; the current approval; and the exact command to record. 'quotient allow <path> <cap>=<sha256>...' records only if each named form still resolves to that sha256 — binding the record to what the operator reviewed. 'quotient revoke <path> [<cap>...]' removes entries. Writers hold an exclusive lock across read-modify-write and publish by temp file + rename. A malformed store refuses every call that needs it and is never overwritten by allow/revoke. Admission reads it every call; absent file = no entries. The file is a never-writable protected store (step 8). No interactive prompt."
alternatives = ["approvals inside the policy file", "approvals under XDG state", "interactive confirmation", "allow re-resolving at record time (rejected: a repoint between review and record is approved unreviewed)", "deletion as revocation (rejected: a delegate can restore the link)"]
rationale = "The security control is file write access: a confined delegate cannot write the approvals store; so it cannot approve its own form. Requiring the reviewed digests closes the review-to-record race without a prompt an agent could answer. The lock prevents a stale writer resurrecting a replaced identity."
consequences = ["new protected store kind for approvals", "first atomic-write and lock helper in src", "new CLI subcommands allow and revoke", "approving is documented as the operator act; an unconfined orchestrator remains fully trusted"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


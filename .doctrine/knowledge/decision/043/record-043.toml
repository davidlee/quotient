[facet]                         # every field typed; seeded empty (captured later)
context = "Once start answers, its request id is spent; queued runs have no process."
choice = "pi_agent_cancel stops running runs via the ladder with cause cancelled and answers once they settle. A queued run cancelled never launches, settles cancelled via the failed arm, writes an audit record, releases its session lock, and its lane advances. notifications/cancelled: on a start still admitting, aborts admission; on pi_agent, cancels its run (as today); on wait, ends the wait only. EOF: every running run aborted and every queued run dropped, cause eof, audit records, no replies."
alternatives = ["Cancel answers before settlement", "Queued runs survive EOF"]
rationale = "One termination path; nothing outlives the server."

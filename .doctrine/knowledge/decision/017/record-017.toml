updated = "2026-10-24"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "A form must meet form-1 G1-G10 for every caller option the text check can see; binds delivered via --args <fd> or add-runtime stay the caller's responsibility. jail.nix unsafe-add-raw-args cannot be restricted at build time. A sweep of satan's current forms (via makeJailedPi) found every feature they use expressible under this split."
choice = """Builder-fixed: the wrapper with three exit-64 guards and the session hand-off; the launcher sets quotient_root=$(pwd -P) once, in the builder's deferred tail so caller runtime code cannot reassign it; root bind (ro for read, rw for write) and session bind at their own absolute paths; --chdir "$quotient_root"; --die-with-parent (never disabled); jail.nix base private /tmp; the empty-environment bwrap; a state mask: --tmpfs over ${XDG_STATE_HOME:-$HOME/.local/state}/quotient and over each absolute path in protect (optional, for a non-default session home or run dir), each only if it exists on the host at launch (a missing path reveals nothing, and bwrap cannot create a mount point under a ro bind). Caller: packages (add-pkg-deps), options (a function of jail.nix combinators), env, exposure (extra writable host paths, bound rw by the builder and reported in family.exposure), protect. Order: jail.nix base, then builder home (tmpfs or persisted), then caller options, the exposure binds and piFiles, then the state mask, then root bind, session bind and --chdir last. Under read the root's ro bind covers any exposure path inside the root (G2 wins; G5 caps writes, it does not promise them). checkFormFamily refuses: a baseline rw bind outside family.exposure; a bind targeting the root path; a caller bind or tmpfs targeting exactly /tmp; a --setenv QUOTIENT_*; no-die-with-parent; a caller --chdir. Binds delivered via --args <fd> or add-runtime RUNTIME_ARGS are invisible to the text check: documented as the caller's responsibility, hostile-audit is the behavioural backstop."""
alternatives = ["caller options last (would let options cover root/session binds)", "caller options before the home bind (home bind covers ro binds under ~)", "refuse caller --args/add-runtime in the check (breaks satan's doctrine closure binds)"]
rationale = "The operator is the caller and trusted; the check guards mistakes, not adversaries. Builder binds last win at their paths in bwrap."
consequences = ["the form's cwd is always the canonical root", "no wrapper chain (form execs the launcher directly)", "residual: --args/add-runtime binds unchecked", "the state mask makes other sessions and run evidence unreadable whatever the caller binds (G6)", "a shared temp is an exposure path bound beside /tmp with env.TMPDIR; /tmp itself stays private (G4)", "with persistHome the state mask creates an empty quotient state directory inside the persisted home"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


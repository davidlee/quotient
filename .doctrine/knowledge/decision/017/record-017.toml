[facet]                         # every field typed; seeded empty (captured later)
context = "A form must meet form-1 G1-G10 whatever toolchain or jail options the caller adds. jail.nix unsafe-add-raw-args cannot be restricted at build time. A sweep of satan's current forms (via makeJailedPi) found every feature they use expressible under this split."
choice = """Builder-fixed: the wrapper with three exit-64 guards and the session hand-off; root bind (ro for read, rw for write) and session bind at their own absolute paths; --chdir "$PWD"; --die-with-parent (never disabled); jail.nix base private /tmp; the empty-environment bwrap. Caller: packages (add-pkg-deps), options (a function of jail.nix combinators), env, exposure (extra writable host paths, bound rw and reported in family.exposure). Order: jail.nix base, then builder home (tmpfs or persisted), then caller options and piFiles, then builder root bind, session bind and --chdir last. checkFormFamily refuses: a baseline rw bind outside family.exposure; a bind targeting the root path; no-die-with-parent; a caller --chdir. Binds delivered via --args <fd> or add-runtime RUNTIME_ARGS are invisible to the text check: documented as the caller's responsibility, hostile-audit is the behavioural backstop."""
alternatives = ["caller options last (would let options cover root/session binds)", "caller options before the home bind (home bind covers ro binds under ~)", "refuse caller --args/add-runtime in the check (breaks satan's doctrine closure binds)"]
rationale = "The operator is the caller and trusted; the check guards mistakes, not adversaries. Builder binds last win at their paths in bwrap."
consequences = ["the form's cwd is always the root; no wrapper chain (form execs the launcher directly)", "FD 22 is reserved by the builder for secretEnv", "residual: --args/add-runtime binds unchecked"]
decided_by = "operator (user), 2026-10-24 session"
decided_on = "2026-10-24"


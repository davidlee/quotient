[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected context-gap and missing-compaction cases were not covered in the initial test delta"
detail = "Expected: PHASE-01 tests pin the monotonic peak across a later measurement gap and ensure every counted result-bearing compaction without usage increments the context gap exactly once (plan EX-1; design §2). Observed: the initial test delta covered assistant gaps and measured compaction results but omitted both cases, so resetting the peak on a gap or omitting the compaction context gap could regress unnoticed. Repair: the final test delta now asserts peak 155 remains after a subsequent invalid vector at src/reduce/reduce.test.ts:258-265, and asserts the missing-usage compaction result yields one context gap without changing the legacy counter at lines 305-314. The final focused context suite passes 6/6."
disposition = "fix-now"
response = "The tests were extended before phase closure. The retained-peak case at src/reduce/reduce.test.ts:258-265 measures 155 tokens, then observes an invalid vector and verifies peak remains 155 with one context gap. The unpriced-compaction case at lines 305-314 asserts one counted request, one context gap, no increment to the legacy top-level gap count, and unchanged accounting='unknown'. The final focused context suite passed 6/6; the full suite passed 321/321."


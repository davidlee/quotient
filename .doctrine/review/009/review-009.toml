[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Design sec-2 says a non-absolute root/path makes the store malformed; shipped code refuses any non-canonical one (DEC-012)"
detail = """
Expected: design.md sec-2 "The approvals store" states the closed-world rules the reader enforces.
Observed: the closed-world bullet lists "a non-absolute path" (design.md:227). The shipped reader refuses any `root` or `path` where `path.resolve(x) !== x` (trailing slash, `.`, `..`, `//`), and detects duplicates on that canonical form, without normalising — DEC-012 (proposed). docs/contract/quotient-approvals-1.md:55-70 and :187 already state the canonical rule. The design is the stale artefact; the code and contract agree.
"""
disposition = "design-wrong"
response = """
The code and contract are right; design sec-2 is stale. Reconciliation brief "Per-slice (direct edit)": design.md sec-2 "The approvals store" closed-world bullet — replace "a non-absolute path" with "a `root` or `path` that is not canonical absolute (`path.resolve(x) !== x`: relative, trailing slash, `.`, `..`, `//`), refused rather than normalised, with duplicates detected on the canonical form", citing DEC-012. DEC-012 itself is proposed: settling it accepted is part of reconcile (needs the operator's assent).
"""


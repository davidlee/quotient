[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "slice verify-vt fails five VT keyword mandates although each mandated behaviour is tested"
detail = """
Expected: `doctrine slice verify-vt 2` passes every VT criterion.
Observed: five FAIL on keyword absence only:
- PHASE-01 VT-2 `.quotient/help` — tested by server.test.ts:799 "a legacy launch-dir help layer fails start-up too…" (asserts the layer path, stderr line and profile-invalid).
- PHASE-03 VT-1 `nested roots` — profiles.test.ts:435 "the roots entry is the deepest containing one, whichever order…".
- PHASE-04 VT-1 `both orders` — server.test.ts:689 (loops 'entry first' / 'alias first' × both alias variants).
- PHASE-04 VT-3 `nested approvals` — server.test.ts:550, :559 (deepest governs; shallower governs outside).
- PHASE-05 VT-3 `revoke advice` — approve.test.ts:141 (asserts "advice    quotient revoke /work" when the governing link is missing).
Plan criteria are immutable, so the fix is to make test titles carry the plan's vocabulary.
"""
disposition = "fix-now"
response = """
Fixed in this audit: six test titles now carry the plan's vocabulary, no assertion changed — server.test.ts:550 "nested approvals: …", :568 "…no longer in roots…", :657 "…the extensions check precedes the store", :689 "…roots in both orders…", :799 "….quotient/help layer…"; profiles.test.ts:435 "nested roots: …"; approve.test.ts:141 "…(adding revoke advice)…". (PHASE-04 VT-3 also lacked `no longer in roots` and `precedes the store`, hidden behind its first failing keyword.) `slice verify-vt 2`: zero FAIL. Those three files: 94/94 pass; lint 0 / 49 / 32 errors, at baseline.
"""


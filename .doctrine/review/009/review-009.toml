[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Design sec-3 says recording adds a deeper approval that governs; shipped allow refuses when a deeper approval already governs (DEC-013)"
detail = """
Expected: design.md sec-3 "quotient allow and quotient revoke" describes what record does in every governing-approval position.
Observed: design.md:337 says "recording then adds a deeper approval that governs calls inside the roots entry", assuming the governing approval is shallower. When a stored approval is deeper than the roots entry (e.g. left from an older roots list), a new roots-entry approval would change nothing. Shipped `allow` refuses to record under the lock, names `quotient revoke <deeper root>`, and the report prints that advice instead of an inert `allow` command — DEC-013 (proposed); src/approve.test.ts:301 ("a deeper approval keeps governing…"); quotient-approvals-1.md:118, :136-137; quotient-policy-2.md:238-242. The design is the stale artefact.
"""
disposition = "design-wrong"
response = """
The code and contracts are right; design sec-3 is stale. Reconciliation brief "Per-slice (direct edit)": design.md sec-3 "quotient allow and quotient revoke" Report paragraph — qualify "recording then adds a deeper approval…" to the shallower-governing case, and add a fourth Record check: when the governing approval is deeper than the roots entry, record refuses under the lock naming `quotient revoke <deeper root>`, and the report prints that advice instead of an `allow` command. Cite DEC-013. DEC-013 is proposed: settle accepted at reconcile with the operator's assent.
"""


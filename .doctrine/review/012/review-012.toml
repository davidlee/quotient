[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "a path climbing above a braced default should be refused; observed: ${quotient_root:-/a/b}/../.. is accepted"
detail = """
Expected: a mount path that climbs above its anchor is refused (DEC-029 Amendment 3, `climbs`), as `"$quotient_root/../.."` is.
Observed: canonical_target (:400-404) takes the anchor up to the first `/`, which falls inside the braces: `${quotient_root:-/a/b}/../..` → anchor `${quotient_root:-`, rest `/a/b}/../..`, and the `..`s are consumed by `a` and `b}`; climbs is false.
Repro (check, executed): `--ro-bind "${quotient_root:-/a/b}/../.." /y` → accepted. At launch `$quotient_root` is always set, so this binds the project's grandparent read-only.
Pre-existing (anchor logic predates 1347f3b), but the round-3 path rules rely on it. Arguably within the "variables expanded at launch" residue; the inconsistency with the unbraced spelling is the defect.
Suggested fix: take the anchor as the whole `${…}` (or `$name`) before splitting the remainder on `/`.
"""
disposition = "fix-now"
response = """
Fixed under ISS-003: canonical_target takes a braced variable as one anchor, its default's `/` included, so `${quotient_root:-/a/b}/../..` climbs. Fixture `mount-climb-braced` (refuse:(c)) red before, green after; `"$quotient_root/sub"` and `"${quotient_root}"` still pass.
"""


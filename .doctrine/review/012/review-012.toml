[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "builder and checker should agree on refused control characters; observed: builder refuses DEL, which the check reads, and leaves env names unchecked"
detail = '''
Expected: nix/form-family.nix:89-94 says the builder refuses what the check refuses ("a control character in it but tab").
Observed: controlChars (:99-101) includes 127 (DEL); check.sh's filter (`tr -d '\001-\010\013-\037'`, :227) admits DEL, so the builder over-refuses without a stated reason. `env` names are not validated (secretEnv names are, :285); a control byte in an env name would reach the bwrap line and be refused by the check as "a control byte" rather than by the builder by name.
Inference from the code; no family built.
'''
disposition = "fix-now"
response = """
Fixed under ISS-003: the builder's control-character set is C0 minus tab (DEL dropped: the check reads it), and env names must be POSIX identifiers like secretEnv names (message now "env and secretEnv names must be valid POSIX names"). Sample family `delenv` + fixture `del-in-env` (pass) red at evaluation before, green after; evalRefusals gains `env-name`, asserted by form-probe. docs/nix-forms.md updated.
"""


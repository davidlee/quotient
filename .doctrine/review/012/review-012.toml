[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "(j) should recognise ${HOME:-…} as a spelling of the home; observed: ${HOME:-/x}/.local/state/quotient mounted elsewhere passes"
detail = """
Expected (DEC-031): protected state is recognised "in each textual spelling"; DEC-031 enumerates `~/…`, `$HOME/…`, `${HOME}/…` and the XDG expression.
Observed: spelled_path (:614-629) maps `$HOME` and `${HOME}` but not `${HOME:-…}`; HOME is always set at launch (DEC-019 precondition), so the default never applies.
Repro (check, reviewer executed): `--bind "${HOME:-/x}/.local/state/quotient" /elsewhere` passes (j); `"${HOME}"/.local/state/quotient` is caught.
Open question: this may be read as the "variables expanded at launch" residue, since DEC-031's list is enumerated. Pre-existing.
"""

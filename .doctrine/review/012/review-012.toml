[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = 'a $ quoted apart from the name after it should be read as text; observed: "$"x/y reads as the variable $x and is admitted as anchored'
detail = """
Raised by the reviewer verifying the F-3 fix; reproduced by the responder.
Expected: `"$"x/y` (bash: the literal relative path `$x/y`) is refused as relative.
Observed: the first parse yields the same word as `"$x"/y`, so the F-3 anchor pattern admits it. `--ro-bind "$"x/y /z` and `"$"HOME/x` accepted (check, executed); `bash -c 'printf "[%s]" "$"HOME/x'` → `[$HOME/x]`.
Residue noted: a single-quoted `'$x'` reads the same way; writeShellApplication's shellcheck (SC2016) fails such a launcher's build (DEC-036 context).
"""
disposition = "fix-now"
response = """
Fixed under ISS-003: shell_words refuses a `$` followed by anything but a name start, `{` or `@` (the `"$@"` the line carries). Fixture `dollar-quoted-apart` (refuse:(c)) red before, green after; corpus 131/131, so nothing the builder emits is refused. The single-quoted `'$x'` spelling stays covered by the build's shellcheck, not by the check.

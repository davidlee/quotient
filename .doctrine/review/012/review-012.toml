responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Examined commit 1347f3b (RV-011 round-3 fixes) and its interaction with shell_words, canonical_target, unreadable_mounts, spelled_path and protected_aliases in nix/check.sh and the refusals in nix/form-family.nix, for false acceptance (G4/G5/G6, rules (c), (d), (g), (j)) and false refusal of builder text. Reproductions executed against check.sh's own functions and, for F-1/F-2, the real bwrap. Then verified the ISS-003 fixes for F-1..F-6 and F-7..F-8 the same way. Not re-examined: the rest of check.sh beyond these functions, form-probe, docs.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-003"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "a mount reached through an earlier --symlink should be refused; observed: LINK/.. canonicalises past the link and is accepted"
detail = """
Expected (DEC-029 Amendment 3.3, F-31): a mount whose target or source lies at or under an earlier `--symlink` destination is refused under (c).
Observed: nix/check.sh unreadable_mounts (:700-708) compares `spelled_path "$path"`, which runs canonical_target (:397-428). canonical_target collapses `..` lexically, so `/x/y/l/../tmp` becomes `/x/y/tmp`, not under link `/x/y/l`. The kernel follows `l` first, then applies `..`.
Repro (check, executed against a copy of check.sh minus `main`): `exec bwrap --dir /a --dir /x/y --symlink ../../a /x/y/l --bind /tmp/quotient-checks/exposure /x/y/l/../tmp` — unreadable_mounts and protected_aliases print nothing; (d) compares the same canonical form and sees no second /tmp mount.
Repro (runtime, executed): `bwrap ... --tmpfs /tmp --dir /a --dir /x/y --symlink ../../a /x/y/l --ro-bind <hostdir> /x/y/l/../tmp -- sh -c 'cat /tmp/m'` printed the host marker: a host directory mounted over the jail's /tmp (G4).
G6 variant (check executed; runtime executed by the reviewer): `--dir /home/v --symlink ../v ~/l --ro-bind ~/.local/state/quotient ~/l/../.local/state/quotient` passes (j) (target spells the same as the source) yet lands at /home/.local/state/quotient, unmasked.
Fixture gap: `mount-through-symlink` covers only `alias/.`.
Suggested fix: refuse a `..` segment in any mount path once a `--symlink` has appeared on the line (a line the check cannot read exactly is refused), or test links against prefixes normalised without `..`.
"""
disposition = "fix-now"
response = """
Fixed under ISS-003 (operator: fix all, work off the backlog item). unreadable_mounts refuses a `..` in a mount target once the line carries a `--symlink`: the kernel follows the link before the `..`, which the lexical canonical form cannot. Fixture `mount-symlink-dotdot` (refuse:(c)) red before, green after; the reviewer's G6 variant (`~/l/../.local/state/quotient`) is now refused under (c).
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Fixed under ISS-003 (operator: fix all, work off the backlog item). unreadable_mounts refuses a `..` in a mount target once the line carries a `--symlink`: the kernel follows the link before the `..`, which the lexical canonical form cannot. Fixture `mount-symlink-dotdot` (refuse:(c)) red before, green after; the reviewer's G6 variant (`~/l/../.local/state/quotient`) is now refused under (c).
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Verified by the Opus reviewer against the staged fix (original repros refused/admitted as expected), fixture red→green, corpus 131/131, gate green (iss003-gate2.log)."


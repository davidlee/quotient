Observed: unreadable_mounts (:704-708) applies the link test to every path field, sources included.
Repro (check, executed): `--symlink /nix/store/cfg ~/.config --ro-bind ~/.config/git /etc/gitconfig` refused with "'--ro-bind ~/.config/git' lies at or under the symlink '~/.config'".
Repro (runtime, reviewer executed): `--symlink ../../nix $P/marker --ro-bind $P/marker/m /out -- cat /out` printed the host file.
Suggested fix: test only record[1] (the target) against links.
"""

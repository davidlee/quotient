[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = 'a path opening with $ should be admitted only when the $ opens a variable; observed: "$"/x and "$$"/x pass as anchored'
detail = """
Expected (DEC-029 Amendment 3.2): every mount path is absolute or begins with a symbol (an unquoted `~`, a `$`-variable).
Observed: unreadable_mounts (:694) admits `'$'*`. `"$"/x` is the literal relative path `$/x` (bash: printf "[%s]" "$"/x → [$/x]); `"$$"/x` expands to a PID-relative path.
Repro (check, executed): `--ro-bind "$"/x /y` → no refusal from unreadable_mounts or protected_aliases. A rw variant still fails (g) (not in EXPOSURE); the read-only bind of a launch-directory-relative path passes.
Suggested fix: admit `'$'[A-Za-z_]*` and `'${'*` only.
"""
disposition = "fix-now"
response = """
Fixed under ISS-003: a `$` anchors a path only as `$name…` or `${name…`. Fixtures `mount-dollar-literal` and `mount-dollar-pid` (refuse:(c)) red before, green after.
"""


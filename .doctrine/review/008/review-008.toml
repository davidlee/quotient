[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "The roots-entry lookup does not supply the governing-link state required by the pure allow report"
detail = """
Raised by codex, acting through RV-008's declared default raiser role (the ledger rejects the requested codex alias as invalid role).

Amendment A1 adds a single ProjectFormLookup tuple with governing, base and one probe (design.md:161-176), makes allow obtain it with base = rootsEntry (:189, :317), and makes report rendering pure over those lookups and the slot (:335). The retained requirement in the same report paragraph is that a governing approval whose own link is missing or changed must be identified as such and accompanied by revoke advice. PHASE-03/EX-7 and VT-5, PHASE-05/EX-1..EX-2 and VT-3 repeat this one-probe/pure-rendering allocation.

Concrete inferred information gap: roots are /work/A and /work/A/B, write approval is at A, and allow reports B. The overridden lookup returns governing=A, base=B, probe=B's candidate form. Hold the store, B's link/bytes and slot fixed; compare host state 1 where A's link still matches its approval with host state 2 where A's link has been deleted or repointed. The declared lookup result is identical in both states because only B is probed, but the report is required to distinguish them. A pure renderer cannot recover the unobserved A-link state. Conversely comparing B's candidate identity to A's approval would falsely diagnose a healthy parent approval as changed. This is a design-level data-flow counterexample, not an executed implementation failure.

Repair: explicitly supply both observations when the governing root differs from rootsEntry: the candidate at rootsEntry for the approval command, and the form at governing.root for the current-admission status/revoke advice. Extend the lookup/report inputs or explicitly prescribe a second use of the same lookup composition; do not introduce another independently assembled store/governing/base/probe algorithm. Add report tests varying A's link while B stays fixed, and vice versa. Keep admission's omitted-base behavior and record's fresh path+digest check inside updateApprovals unchanged. This closes a contradiction introduced by making the previously filesystem-capable report a renderer over the new single-probe result."""
disposition = "fix-now"
route = "review"
response = "Contest accepted: a changed candidate also changes its identity lines. design sec-4 approve: report row and plan PHASE-05/VT-3 now say: varying the candidate changes its identity lines and the suggested command but not the governing status; varying the governing link changes the governing status and adds revoke advice. Two-lookup repair otherwise unchanged."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Verified: with base = rootsEntry the lookup never observes the governing root's link, so a pure renderer cannot report its state. Repair keeps one composition: allow calls lookupProjectForm without base (what admission sees: governing status, revoke advice) and, only when governing.root differs from rootsEntry, again with base = rootsEntry (the candidate for the record command). design sec-2 'The selection module', sec-3 allow/report paragraphs, sec-4 approve: report row; plan PHASE-05/EX-1 and VT-3 (vary the governing link with the candidate fixed, and vice versa). Admission's omitted-base path and record's in-lock path+digest check unchanged."

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
CONTEST on a new contradiction in the repair's verification wording; the two-lookup architecture itself is accepted. Codex rechecked commit 7cfccfb: design.md:191/:319 and PHASE-05/EX-1 now supply the governing-link observation without base and the candidate observation at rootsEntry, which repairs the original information gap while preserving one composition. Admission's default base and record's locked full-identity comparison remain unchanged.

However, the new design sec-4 report row (design.md:487) and PHASE-05/VT-3 (plan.toml:152) require that varying the candidate with the governing link fixed 'changes only the suggested command'. The report must also display the candidate's observed real path and sha256 (design.md:325-327, :485; PHASE-05/EX-2 at plan.toml:142). Inferred counterexample: repoint only B's usable candidate from path P/digest H to Q/digest J while its governing A link stays fixed. A correct report must change its resolves/sha256 lines AND the command. Leaving those identity fields unchanged to satisfy 'only the suggested command' would instead present stale reviewed identity. No implementation failure is asserted.

Please narrow both criteria to say candidate identity/usability display and suggested command change, while governing status and revoke advice remain unchanged. This preserves the intended independence test without contradicting the required report contents. No further architectural repair is requested."""

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Contest accepted: a changed candidate also changes its identity lines. design sec-4 approve: report row and plan PHASE-05/VT-3 now say: varying the candidate changes its identity lines and the suggested command but not the governing status; varying the governing link changes the governing status and adds revoke advice. Two-lookup repair otherwise unchanged."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED by codex at design/plan level. Re-read the working diff: design.md:487 and PHASE-05/VT-3 (plan.toml:152) now allow candidate identity lines and the suggested command to change while governing status remains fixed, resolving the contested contradiction with the per-capability identity display. The accepted two-lookup repair remains intact in design.md:191/:319 and PHASE-05/EX-1, and the converse governing-link variation still requires governing-status/revoke advice changes. No new contradiction found in this narrowed recheck. No implementation/runtime claim."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "A5's extensions-before-store order contradicts the retained unconditional store-read rule"
detail = """
Raised by codex, acting through RV-008's declared raiser role.

Expected: the amended design should consistently state when the approvals store is consulted and which refusal wins. A5's new design.md:54 explicitly orders slot -> checkProfileExtensions -> store/project lookup; the added verification row at :475 and PHASE-04/EX-1 plus VT-3 require profile-invalid to win over a malformed store when the slot lacks a profile extension. This is consistent with the actual current order in src/server/server.ts:289-292.

Observed contradiction with unamended text: design.md:226 still promises the store is 'Read on every call that reaches step 5 with a machine slot present.' Such a call can now stop at the extensions check without reading it. The detailed step-5 flowchart (:91-94) also takes a present slot directly to the store-readable decision, omitting the new failure branch; following it would select form-unapproved in the very case A5 says must remain profile-invalid.

Repair: qualify the read rule as applying after the slot and extensions checks have passed, and align the detailed flowchart with that order. Preserve the behavior specified by A5 and the new plan/test criterion. This is verified textual inconsistency introduced by the amendment, not a request to move extensions behind the store or reopen DEC-007..011."""
disposition = "fix-now"
response = "Verified (design.md store-read rule and step-5 flowchart omitted the A5 branch). Read rule now applies to calls that pass the slot lookup and extensions check; flowchart gains the extensions node (profile-invalid) between slot and store. Sweep: the other step-5 order statements agree."


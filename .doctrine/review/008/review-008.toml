[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "A5's extensions-before-store order contradicts the retained unconditional store-read rule"
detail = """
Raised by codex, acting through RV-008's declared raiser role.

Expected: the amended design should consistently state when the approvals store is consulted and which refusal wins. A5's new design.md:54 explicitly orders slot -> checkProfileExtensions -> store/project lookup; the added verification row at :475 and PHASE-04/EX-1 plus VT-3 require profile-invalid to win over a malformed store when the slot lacks a profile extension. This is consistent with the actual current order in src/server/server.ts:289-292.

Observed contradiction with unamended text: design.md:226 still promises the store is 'Read on every call that reaches step 5 with a machine slot present.' Such a call can now stop at the extensions check without reading it. The detailed step-5 flowchart (:91-94) also takes a present slot directly to the store-readable decision, omitting the new failure branch; following it would select form-unapproved in the very case A5 says must remain profile-invalid.

Repair: qualify the read rule as applying after the slot and extensions checks have passed, and align the detailed flowchart with that order. Preserve the behavior specified by A5 and the new plan/test criterion. This is verified textual inconsistency introduced by the amendment, not a request to move extensions behind the store or reopen DEC-007..011."""
disposition = "fix-now"
response = "Verified (design.md store-read rule and step-5 flowchart omitted the A5 branch). Read rule now applies to calls that pass the slot lookup and extensions check; flowchart gains the extensions node (profile-invalid) between slot and store. Sweep: the other step-5 order statements agree."


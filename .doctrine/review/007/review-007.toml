[[finding]]
id = "F-4"
status = "answered"
severity = "minor"
title = "PHASE-03/VT-4's sole keyword already passes on the pre-slice drift test"
detail = """
Expected: a structured VT mandate must have signal for its stated obligation, here that the refusal guard sees ProjectFormRefusal and both new reasons are documented. Observed: PHASE-03/VT-4 (plan.toml:92) selects src/drift.test.ts with keywords = ['Refusal'], no patterns. That substring already occurs repeatedly in the unchanged file (src/drift.test.ts:86-95, :307-310), so the mandate passes before forms.ts or the new refusal rows exist.

Read-only reproduction: parse plan.toml with Python tomllib, read each VT test_file, and check all(k in source for k in keywords). PHASE-03/VT-4 reports ALREADY PASSES on the reviewed tree; it was the only VT row with an existing test file whose entire keyword set already matched before SL-002 implementation. The actual drift suite remains useful: codeRefusals scans new production refusal unions automatically (:91-99), and the suite compares them with the contract (:307-310). This finding concerns the structured mandate's lack of additional signal, not a claim that the existing drift test is broken.

Repair: point the mandate at the phase-owned forms.ts export with distinguishing ProjectFormRefusal/form-invalid/form-unapproved signals and retain a separate explicit check that the existing drift suite ran green, or make this an agent verification that cites the existing guard and its execution evidence. Avoid adding a meaningless comment to drift.test.ts merely to satisfy a novel keyword."""
disposition = "fix-now"
response = "Verified ('Refusal' occurs 10x in drift.test.ts). PHASE-03/VT-4 now targets src/server/forms.ts with keywords 'export type ProjectFormRefusal', 'form-invalid', 'form-unapproved'; new PHASE-03/VA-2 records the drift suite run and the contract rows. Class sweep: no other VT row's keyword set fully matches the pre-slice tree (4 rows share one pre-existing keyword alongside new ones)."


[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "PHASE-04's repoint probe does not require mutation between selection and spawn"
detail = """
Expected: the admission-to-exec test must distinguish executing the real path captured at step 5 from executing the project symlink later (locked design.md:128-134, :273, :449; DEC-008). Observed: PHASE-04/VT-4 (plan.toml:119) only says to repoint 'after admission' and observe the running call; it does not require the repoint to happen before exec, or specify positive evidence for that ordering. PHASE-04/EX-2 states the correct implementation, but the corresponding VT can pass without exercising its critical window.

Verified current-code constraint: the in-process rig starts serve directly (src/server/test-rig.ts:402-419, :427-428). callTool runs root/form selection, session acquisition and child-view checks synchronously until its runChild call (src/server/server.ts:283-393); runChild reaches spawn synchronously before its first await (src/server/spawn.ts:221-303). Waiting for a launcher marker or a normal test event-loop turn and then repointing is already too late to test pathname capture. Inferred false-positive scenario: an implementation that hashes/resolves A but hands the project link to spawn still passes a test that waits for A to start before repointing the link to B. No SL-002 runtime implementation was executed.

Repair: make VT-4 require the order select/hash A -> pause before process creation -> repoint the link to B -> resume -> prove A ran and B did not, with the audit identity checked too. Assign the phase responsibility for a deterministic barrier or equivalent controlled spawn observation; require a negative control in which executing the link fails the test. This narrows the verification criterion without changing the approved execution mechanism."""
disposition = "fix-now"
route = "review"
response = "Observation verified: no await between selection and spawn (spawn.ts:221-303), so a 'repoint after admission' test cannot hit the window, and VT-4 as written could pass with the link exec'd. Prescription narrowed: no barrier needed. The spawn record's form is the exact command passed to spawn() (spawn.ts:224 launchCommand -> :279 audit form: command -> :296 spawn(command, argv)). PHASE-04/VT-4 now asserts record.form === the captured real path and !== the link path; an implementation handing the link to spawn fails it (the negative control), with no new test seam. The post-settle repoint check stays as a secondary observation."

[[finding.turn]]
act = "raise"
role = "raiser"


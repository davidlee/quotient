disposition = "fix-now"
response = "Verified (help.test.ts:244-251, cli.test.ts:120-128, childview.test.ts:161-170,262-281). Added PHASE-01/EX-8 (migrate these assertions, keep XDG coverage) and VT-5 (childview: write root at the launch directory admitted) and VT-6 (help: launch-dir help layer fails start-up, XDG override kept)."

[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "Changed governed forms lose the design's exact re-approval-command criterion"
detail = """
Expected: design.md:136 requires refusal details to identify the base/governing state, link, real path, observed digest and approved identity where present, and an exact quotient allow command for form-unapproved on a usable form. This includes an ordinary rebuild of an already-approved form, not only first approval.

Observed: PHASE-03/EX-3 (plan.toml:83) requires the exact command only for the ungoverned branch; governed identity mismatch need only name both identities. PHASE-03/VT-3 (:91) explicitly narrows its command assertion to 'ungoverned form-unapproved'. PHASE-04/VT-2 (:117) repeats that split: link-without-entry includes a command, while rebuilt bytes/repointed paths only require both identities. Neither phase otherwise carries the full sec-2 refusal-detail requirement as a criterion.

Concrete inferred omission: for an approval at an unchanged policy root A, rebuilding its otherwise-usable form could produce form-unapproved with old/new identities but no ready-to-run re-approval command and still satisfy every listed assertion. That falls short of the locked design's operator interface. Repair: add the full diagnostic requirement to the selection criterion and assert an exact allow A CAP=NEW_REALPATH@NEW_SHA256 command in the governed-mismatch unit/server case as well as the first-approval case. Verified by comparing the design and authored criteria; no future runtime behavior is claimed."""
disposition = "fix-now"
response = "Verified against design.md:136. PHASE-03/EX-3 now requires the re-approval allow command (approval root, new path, new sha256) for a governed identity change and states the full sec-2 refusal-detail list for every refusal; PHASE-03/VT-3 and PHASE-04/VT-2 assert the command in both form-unapproved cases."


[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "PHASE-01 does not place the existing launch-layer test migrations in its green boundary"
detail = """
Expected: the phase removing launch-dir layers must carry the tests and fixtures coupled to those layers, before its just gate exit. PHASE-01/EX-2..EX-6 remove the layers, add legacy start-up rejection and move release fixtures; its verification rows (plan.toml:35-41) cover new server/config/CLI cases but do not identify the existing help/childview test migration. plan.md:45-49 defers the remaining help work to PHASE-06, whose VT-2 is the first explicit help.test.ts mandate (plan.toml:171).

Verified static incompatibilities in the current suite: src/help/help.test.ts:244-251 plants <launch>/.quotient/help/tool.md and expects it to supply the server's tool description; under PHASE-01/EX-3 that presence must instead refuse start-up. src/cli.test.ts:120-128 plants a bad launch-layer profile and requires stderr to name bad.md, whereas the prescribed legacy check rejects the layer before reading that document. src/server/childview.test.ts:161-182 expects four protected profile/help layers, :262-274 explicitly requires a write root at the launch dir to refuse, and :277-281 requires launch help exposure to refuse. Those assertions contradict the phase's new behavior. Config assertions also need migration, but PHASE-01/VT-3 already places config tests in this phase.

Repair: explicitly include migration/replacement of these help, CLI and childview assertions in PHASE-01's criteria/verification. Retain coverage of XDG protection, bad XDG profiles and XDG help overrides, and replace the old launch assertions with the intended admission/legacy-rejection cases. This is a missing coupled-test allocation, not a claim that the six-phase architecture cannot work: just gate would catch the unchanged assertions, and a phase implementer could currently discover the missing work."""
disposition = "fix-now"
response = "Verified (help.test.ts:244-251, cli.test.ts:120-128, childview.test.ts:161-170,262-281). Added PHASE-01/EX-8 (migrate these assertions, keep XDG coverage) and VT-5 (childview: write root at the launch directory admitted) and VT-6 (help: launch-dir help layer fails start-up, XDG override kept)."


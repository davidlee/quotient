title = "Expected sec-9 Risks to list every limit accepted in execution; observed five accepted limits missing"
detail = """
Accepted during execution, absent from sec-9 "Risks and explicit limits":
1. PHASE-02 Codex F1 (on RSK-003): equal hostnames do not prove one machine — two hosts named alike sharing a run dir, or an nspawn container with its own boot_id, read a live owner stale → false lost. User: record, don't chase.
2. PHASE-06 Codex F1: each wait leaves a reaction on a live record's `settled` promise until the run settles; bounded by the run's lifetime.
3. PHASE-07: a client that writes and closes stdin at once may get some or none of its replies; EOF cancels runs in flight (drain-on-EOF deferred, IDE-006).
4. M4 (at-trigger closing) is pinned only at runs.test level; closingRefusal is unreachable through serve (PHASE-08).
5. PHASE-09 weak spot: the tasks/cancel-before-end case rests on a TERM-ignoring sleeper and a 1.5 s grace margin.
Also: the "Session locks keep today's liveness rule" bullet should name timens (D-1's F2 applies to locks too) and the PHASE-05 F2 change (a non-positive-pid lock now reads as an unreadable record, fail-closed).
The existing bullets were checked against shipped behaviour and still hold.
"""

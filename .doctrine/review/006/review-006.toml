[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Digest-only allow confirmation can approve a different real path than the operator reviewed"
detail = """
Expected: record must bind the entire reviewed identity, defined at design.md:123 as (real path, sha256), and close first-review finding 3 in notes.md:94. Observed: design.md:275-301's command carries only the digest; its fresh probe records whichever real path now supplies those bytes. DEC-009's amendment therefore closes changed-byte repoints but not changed-path/same-byte repoints.

Concrete inferred scenario: the report shows /opt/forms/A/launch with digest H. Before the displayed command runs, a write delegate repoints <root>/.quotient/forms/write to /opt/forms/B/launch. A and B are outside the writable set, executable, and have byte-identical launcher scripts, so both satisfy H. The script can select its delegate-immutable confinement inputs relative to dirname($0), making A and B materially different forms without any writable external input or hash collision. allow <root> write=H records B without the operator reviewing B. Even without differing runtime behavior, B is a different identity by the accepted contract. The approvals lock does not bind the old report; it only serializes the new probe and publication.

Carry the expected real path along with the digest (or a confirmation token covering canonical root, capability, resolved path and digest), and compare all identity components under the lock. Add a report-to-record same-bytes/different-path repoint test and require no write on mismatch; the existing :442 digest mismatch test will pass the faulty design. The accepted DEC-009 needs the corresponding narrow correction. Verified by direct comparison of the accepted decision, first-review table and draft; the exploit is inferred, not a runtime result."""
disposition = "fix-now"
response = """
Re-disposed with route probe; substance unchanged from the verified answer. Design repair: quotient allow PATH CAP=REALPATH@SHA256 records only if, under the store lock, the fresh probe's real path and sha256 both equal those given; otherwise nothing is written and it exits 1. DEC-009 amended; design sec-3 Record.
Probe. Must hold against: a write delegate that repoints the project link between the operator's report and the record command, to a different real path with byte-identical content, or to different bytes at the same path; and a batch where one pair matches and another does not. Need not hold against: an unconfined orchestrator that runs both the report and the record itself; a target the operator left delegate-writable (F-2 obligation).
Criterion must assert: after a report shows real path A with digest H, repointing the link to B with identical bytes makes allow ROOT write=A@H exit 1 with both identities named and leave approvals.json byte-identical; the matching case records exactly A with H. Host phase constraint: the phase that implements src/approve.ts allow, after updateApprovals and probeProjectForm exist.
"""
route = "probe"


[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Retained governing approvals become unreachable by revoke after their policy root is removed"
detail = """
Expected: the operator can revoke a retained governing approval by its recorded root, including when that root is no longer an exact policy.roots entry; revocation must identify the intended stored selection. Observed: the F-1 revision explicitly keeps such approvals active (design.md:197-200, :443, :474), but sec-3 requires BOTH allow and revoke to resolve the input to the CURRENT longest policy roots entry and calls that the record root (:290). Revoke only removes that record root's entries and returns success for an absent one (:312). This leaves approvals that admission still applies but no revoke command can target. DEC-008's 'revocation is an operator verb' and DEC-009's revoke surface consequently lack an operation for a newly supported state.

Concrete inferred scenario: initially policy.roots = [/work, /work/A], with write approval keyed /work/A. Remove /work/A from roots, leaving /work. Calls at /work/A remain admitted and governed by its retained approval, as the new design requires. Now 'quotient revoke /work/A write' resolves record root /work, removes no /work/A entry, exits 0 if /work has no approval, and leaves the intended approval governing. Every path inside A likewise maps to /work, so changing the argument cannot reach the stored key. If a /work approval ALSO exists, the same command instead removes that distinct parent's approval and changes selection for other calls under /work. Similar unreachable entries arise when a recorded directory disappears, since resolveRoot requires an existing directory. The report's suggested revoke (:308) cannot remedy these states.

Verification: read the cited design and amended DEC-007..009; evaluated their specified containment/longest-root/removal rules in memory using the actual within() comparator (no file writes). For the first scenario, command = revoke /work/A write; governingBefore = /work/A; recordRoot = /work; removed = 0; governingAfter = /work/A. This is an inference from the drafted algorithm, not an executed SL-002 CLI implementation.

Repair direction: give revoke an explicit way to select the STORED canonical approval key independently of current allowlist membership and mutable filesystem resolution; distinguish that target from allow's current record root and from a governing ancestor. Specify behavior for deleted/moved roots and nested approvals so a requested child revoke cannot silently revoke its parent. Reconcile DEC-009/new approvals contract and add remove-root-then-revoke, deleted-root cleanup, and parent-approval-preservation tests. This finding is introduced/exposed by the retained-containment selection revision; it does not contest the operator's chosen containment model or the accepted relocation/immutability limits."""
disposition = "fix-now"
response = """
Re-disposed with route review; substance unchanged from the verified answer. The question is whether the revoke verb's commitment is right given retained approvals; settled in prose in this review: quotient revoke APPROVAL-ROOT [CAP...] matches a stored root exactly (absolute, lexically normalised), reads neither policy nor filesystem, never removes another root's entries, and exits 1 listing stored roots for an unknown root or capability. DEC-009 amended; design sec-3 Revoke and sec-4 tests (removed root, deleted directory, parent preserved, unknown root); slice scope reconciled.
"""

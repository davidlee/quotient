Criterion must assert: after a report shows real path A with digest H, repointing the link to B with identical bytes makes allow ROOT write=A@H exit 1 with both identities named and leave approvals.json byte-identical; the matching case records exactly A with H. Host phase constraint: the phase that implements src/approve.ts allow, after updateApprovals and probeProjectForm exist.

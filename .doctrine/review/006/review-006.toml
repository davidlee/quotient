[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "The new approvals JSON example conflicts with the claim that the policy drift guard needs no change"
detail = """
Expected: documenting quotient-approvals/1 inside the policy contract must preserve useful schema validation and a green drift check. Observed: design.md:172-185 defines an approvals JSON example and :342 puts the approvals format in docs/contract/quotient-policy-2.md, but :415 says src/drift.test.ts needs no new rule and :446 characterizes the JSON check as parsing. The actual inadmissibleBlocks at src/drift.test.ts:245-255 sends EVERY json fence in that contract through readPolicy; policyViolations(:259-264) and the active test(:326-329) require each to be an admitted quotient-policy/2 document. Valid JSON of another schema fails.

Focused no-file-write probe: evaluated the actual inadmissibleBlocks and validatePolicy function bodies in memory against the draft's approvals example. Result: 'proposed approvals example in policy contract json block 1: policy-invalid: schema "quotient-approvals/1" is not one this build reads: expected "quotient-policy/2"'. This verifies the existing guard's behavior; the draft has not yet inserted that example into the contract.


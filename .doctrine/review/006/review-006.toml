[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "The current policy's writable set does not make an admitted executable immutable to other live delegates"
detail = """
Expected: hashing an approved executable and later execing its pathname must not permit a confined delegate to replace the bytes between the two. Observed: design.md:81, :118-121 and :281 derive the forbidden set only from the currently read policy and this process's session home, then claim that exclusion closes the swap race. That proves no immutability against still-running calls with older grants, or another supported server configured with a different QUOTIENT_POLICY/session home. G5 constrains each child to its own admitted writable set; it does not equate all live writable sets with this call's snapshot.

Concrete inferred scenario using one policy: start a long-running conformant delegate with exposure /opt/project-forms. The operator atomically removes that exposure and approves /opt/project-forms/write (a non-store form expressly supported by DEC-008). The old delegate retains its old writable exposure. On a new call the target is outside every CURRENT root/exposure/session-home and its bytes hash to the approved digest, so step 5 accepts it. Before spawn, the old delegate overwrites that target; src/server/spawn.ts:179-180, :299-306 execs the pathname and runs unapproved bytes. src/server/gate.ts:113-121 rechecks enabled, not removal of old grants, so this scenario does not require a nonconformant form. An equivalent concurrent-server scenario uses B's granted root/exposure containing A's otherwise-excluded target; both deployments can use conformant forms and supported QUOTIENT_POLICY overrides (src/config.ts:28, :49-56).

The accepted DEC-010 rationale needs an explicit, enforceable global immutability premise, rather than treating current-policy path exclusion as sufficient. Require targets that remain immutable to every relevant live delegate (and specify how publication/approval enforces that across policy transitions and server configurations), or execute an identity-preserving verified artifact rather than a subsequently writable pathname. A second hash alone only moves the race. Add a deterministic step-5-to-spawn barrier test with a live older-grant/concurrent-server writer; :435 currently tests only project-symlink repointing. Verified source facts and a concrete inferred design exploit; no runtime SL-002 implementation was executed."""
disposition = "tolerated"
response = """
Re-disposed with route review; substance unchanged from the verified answer. The question is whether to accept the commitment that host-wide immutability of an approved form is an operator obligation, with the outside-writable-paths rule a backstop against the current policy's delegates only. Settled in this review by operator judgement, on the precedent that the policy file is protected the same way (quotient-policy-2.md:228-231). DEC-010 rationale and consequences, design sec-2 rule 3 and sec-4 risk say so; the new contracts must state the obligation.
"""
route = "review"


[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Retargeting a writable roots symlink can discard approval selection and restore the machine default"
detail = """
Expected: a confined delegate cannot change an approved selection back to a broader default; the first-review deletion finding must remain closed across root aliases. Observed: design.md:75-81 canonicalises roots on each call; :187-190 keys approvals solely by that canonical path and makes orphaned entries inert; :107 sends an absent-link/absent-entry pair to the machine form. The risk claim at :456 says changing a symlink target requires fresh approval, but the table does not enforce that.

Concrete inferred scenario: policy roots are [/work, /work/current], where /work/current -> /work/A; the operator approved (/work/A, write) for a narrower project form. A conformant write delegate rooted at /work can replace /work/current with a symlink to /work/B (B has no .quotient/forms/write). A later call at the unchanged spelling /work/current resolves to /work/B, the deepest canonical roots entry is /work/B, the /work/A approval is inert, and the absent/none row executes the broader machine default without allow or revoke. All attacker writes are inside a granted root; this does not require violating G5 or editing policy/approvals. An alternate pre-existing approved B would also transfer selection to a different project identity.

This is a defect exposed by the drafted application of DEC-007/008, not an objection to longest-match or canonical matching in isolation. Preserve operator-owned selection across delegate-mutable changes to a configured root's resolution (for example, bind configured entry plus its approved canonical resolution and refuse changed resolution until an explicit operator act), or reject such mutable root aliases with an enforceable constraint. Add the retarget scenario, including both roots-order permutations, to the nested/symlink root tests; the existing test commitments at :428-437 only repoint the form link or check nesting. Verified by reading the draft and current resolveRoot/canonicalPath (src/server/profiles.ts:340-375; src/server/paths.ts:23-37); future behavior is inferred, not an executed SL-002 implementation."""
disposition = "design-wrong"
response = """
Re-disposed with route probe; substance unchanged from the verified answer. Design repair (operator choice): the governing approval is the deepest approval for the capability whose recorded canonical root contains the call's canonical root; it is the lookup base and wins over any roots-entry match. DEC-007/008 amended; design sec-2 Step 5, Residual: relocation, Invariants.
Probe. Must hold against: a write delegate that can create, delete or retarget symlinks and directories anywhere inside its writable root (including a symlink that is, or lies on the path of, a roots entry), in both orders of the roots list; after its writes, a later call whose canonical root lies inside an approved root runs that approval's identity or refuses, and never runs the machine default form. Need not hold against: relocation, where the orchestrator names a cwd through a delegate-writable symlink and the call runs in a different directory outside every approval (documented residual); an unconfined orchestrator running quotient allow or revoke.
Criterion must assert: with roots /work and /work/current (both orders), an approval at the canonical /work/A, and each retarget variant (current pointed into /work/A/sub; current pointed away from /work/A), a call whose canonical root is inside /work/A refuses or runs A's approved identity, observed in the spawn audit record (form_source project, form_root /work/A). Host phase constraint: the phase that implements step 5 selection in server.ts with forms.ts and approvals.ts, after the approvals reader exists; uses test-rig helpers to plant forms outside roots.
"""
route = "probe"


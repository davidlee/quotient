response = "Verified (resolveRoot canonicalises roots per call, profiles.ts:371-375; paths.ts:102-117). Class: selection keyed by a delegate-mutable resolution. Operator chose approval-by-containment: the governing approval is the deepest approval (per capability) whose recorded canonical root contains the call's canonical root; it is the lookup base and wins over any roots-entry match; only ungoverned calls use the longest roots entry. Calls landing inside an approved root can no longer be re-based onto the machine default. Not adopted: binding the policy's entry spelling. Documented residual: a cwd/roots alias through a delegate-writable symlink can relocate a call to another directory, which gets its own selection; calls inside the approved root are not downgraded. DEC-007/008 amended; design sec-2 (Step 5, Residual: relocation, invariants), sec-3 (record root, report 'governed'), sec-4 tests (retarget in both roots orders, nested approvals, approval outside roots) updated."


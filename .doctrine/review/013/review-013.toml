[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "Evidence gap: whether the tasks extension needs a per-tool declaration (and other wire details) is not recorded in EVD-004"
detail = """
sec-2. EVD-004 does not record: whether a tool must declare that it can answer a task (the 2025-11-25 design had per-tool execution.taskSupport in tools/list; the design adds none); whether the nested tasks/get result carries its own resultType; the member names result/error; cacheScope values and ttlMs:0 semantics; -32602 for malformed _meta ("the spec's rule"); multi round-trip requests. Verified: EVD-004 has no mention of taskSupport or a per-tool execution field.
Failure: if Claude Code's tasks support keys on a per-tool hint, it never declares the extension for pi_agent and tasks silently never happen; every call blocks.
Repair sketch: read the 2026-07-28 tasks extension schema and discover/versioning pages for exactly these points, extend EVD-004, and add any per-tool declaration to the tool table. Separately record as a risk (not a defect) that a client speaking only a newer modern revision plus 2025-06-18 gets -32022 and may not fall back (DEC-063).
Source: reviewer B (F11); evidence gap, not a shown error.
"""

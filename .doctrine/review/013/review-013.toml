[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "needs_success is skipped when a run is started after its predecessor has already settled"
detail = """
sec-3 start step 5, sec-4, sec-7 advance. The needs_success check lives only in advance, which is called only from settle. Start step 5 launches at once when the lane is idle. advance drops settled runs from the head, so "the lane's last run at the moment it was started" is either null (list tail empty) or the failed run that the immediate path never checks.
Failure: start A(lane L); A fails and settles; start B(L, needs_success:true). L is idle, so B launches and runs its writes. Started a moment earlier, B would have refused lane-predecessor-failed. Same calls, opposite outcome, decided by a race with A's settlement; violates DEC-050.
Repair sketch: keep a per-lane last-started pointer separate from the FIFO list and use it as predecessor; place a new run by inserting and calling the same advance step, so one function decides launch or refuse. Test: B with needs_success started after A failed -> lane-predecessor-failed.
Sources: reviewers A (F2) and C (F2); confirmed from the design text.
"""
disposition = "fix-now"
route = "review"
response = "Verified from the design text; DEC-050 requires the check whenever the predecessor settled other than completed. Repair in sec-3 step 5, sec-4 rules and sec-7: each lane keeps a last-started pointer separate from its FIFO list, and that pointer is the new run's predecessor (it survives the head being dropped). start places a run by appending it and calling advance, so one loop decides launch, queue or refuse for every run; the needs_success check therefore runs on immediate placement too. sec-9 runs.test: B with needs_success started after A already settled failed refuses lane-predecessor-failed; started after A completed, it launches."


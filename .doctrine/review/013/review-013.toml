[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The CreateTaskResult reply is not guaranteed to be written before the next input line is handled"
detail = """
sec-1 deferred note, sec-2 Runs as tasks, sec-6, sec-7 server.ts. The design (and DEC-064's premise) says admission, publication and writing the CreateTaskResult happen "in one synchronous step". But the design keeps today's reply structure: the one reply site is after `await` of the handler (server.ts:555-556), and the input loop handles every line of a chunk with `await handleLine` (server.ts:751-757). Whether the next buffered line runs before the reply continuation depends on how many async layers sit between the IIFE and the handler; reviewer A's microtask experiment shows one wrapper is enough for the next line to win.
Failure: tools/call pi_agent (tasks declared) and notifications/cancelled for it arrive in one chunk. The run is published and launched; the notification is handled first and sets silenced; the CreateTaskResult is suppressed. sec-6 says a task call ignores its abort, so the run executes to completion with origin 'task' (never an implicit wait target). The client has no task id and its cancel was ignored.
Repair sketch: write the reply for a synchronously answered call inside handleLine before it returns (handler returns { now: result }), or mark the call answered synchronously so the notification cannot silence it; either way assert it with a one-chunk test via test-rig's send.
Sources: reviewer A (F1), verified against server.ts.
"""
disposition = "fix-now"
route = "review"
response = "Verified: server.ts:555-556 replies only after awaiting the handler, and the input loop handles a chunk's lines back to back. The design's claim that the CreateTaskResult is written in one synchronous step is therefore not delivered by the structure it keeps. Repair in sec-6 and sec-7 server.ts: a handler may answer synchronously (it returns an immediate answer rather than a promise), and handleLine writes that reply before it returns — CreateTaskResult and start's handle both take this path. The reply gate is unchanged; a notification read afterwards names an answered request and is ignored, which is exactly DEC-064's premise. sec-9 server.test: tools/call pi_agent declaring tasks followed by notifications/cancelled for it, in one write, answers the CreateTaskResult and leaves the run running."


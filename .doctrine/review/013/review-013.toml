[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "A run task's failure has no owner: a throw or rejection in launch/readmit/settle leaves a run neither settled nor lost"
detail = """
sec-7 runs.ts / sec-3 invariants. Today every throw in a run is caught by the tools/call IIFE (server.ts:553-579). In the design the run task belongs to no call; only executeRun is said never to throw. `launch` = readmit then executeRun, and readmit is today's admission code; `settle` uses `admittedOf.get(...)!` and releases the session with no finally; tasks/cancel calls registry.cancel without awaiting.
Failure: readmit throws during advance (inside the predecessor's settle). The record stays `running` with no promise behind it: its session lock never frees (session-busy forever), waits time out forever, its lane stalls, and registry.close() awaits a settled that never resolves, so EOF hangs. If the rejection is unhandled instead, Node's default terminates the server with detached children alive.
Repair sketch: one guard in runs.ts — Promise.resolve().then(() => launch(...)).catch(e => failedResult('error', ...)).then(doc => settle(...)); settle total (no non-null assertions, idempotent on a terminal record, release and resolve in finally); every un-awaited promise gets a catch. Tests: a fakeLaunch that rejects and one that throws synchronously each settle failed/error, free the session, and let close() resolve.
Sources: reviewers A (F3) and C (F1), verified against server.ts.
"""
disposition = "fix-now"
route = "review"
response = "Verified: today's IIFE catch (server.ts:557-569) is the only guard, and the design moves the run task out of every call. Repair in sec-7 runs.ts: the registry owns one launch guard — the launch is invoked through a promise chain whose rejection or synchronous throw becomes failedResult('error', ...) and is handed to settle; settle is total (no non-null assertions, a no-op on a terminal record, session release and settled resolution in a finally); every promise the server does not await (tasks/cancel) carries a catch to diagnostics. sec-3 invariants gain: every published run reaches settle exactly once. sec-9 runs.test gains: a fakeLaunch that rejects and one that throws synchronously each settle failed with cause error, free the session, advance the lane, and let close() resolve."


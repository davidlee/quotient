route = "refresh"
response = "Contested in substance, accepted as a record lag. SEP-2663 (the tasks extension, Final), wire-differences table: the task parameter on CallToolRequest is removed, and the tasks.requests capability declarations are not part of the extension; its motivation names the per-tool execution.taskSupport handshake as the fragility it removes, and says the extension capability is the single handshake, with the server deciding per request whether to return a task. The 2026-07-28 ext-tasks schema.ts defines no Tool, execution or taskSupport member. So the design is right to add no per-tool declaration. The schema also settles the nested result: CompletedTask.result matches the result type of the original request, so the modern CallToolResult inside tasks/get carrying resultType is correct. Edit EVD-004 to record these two points with the SEP citation; sweep sec-2's governing-sources table. The remaining unrecorded details (cacheScope values, -32602 for malformed _meta) are minor and are stated in sec-2 as the server's choice where the evidence is silent."


[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "The taught wait loop calls ack, which does nothing when waiting by name and costs an approval prompt per turn in Codex"
detail = """
sec-5 loop, sec-8. Named runs are "always reported, whatever their ... acknowledgement", so in the taught loop (wait(runs: ids)) ack changes nothing the caller sees; "acknowledging after use makes a lost reply harmless" holds only for selector-less waits. ack is not read-only (DEC-054), so clients serialise it and Codex's default 'writes' approval mode prompts for it (EVD-003).
Failure: a Codex user runs the taught loop over five runs and gets an approval prompt each iteration for a call with no effect.
Repair sketch: teach two patterns — by name (keep ids yourself, no ack) and selector-less (wait without runs, ack what you used); state the approval consequence in help/setup.md and the README client guidance. Note also (reviewer A F6) that implicit selection and acks are server-wide, not per caller: two subagents sharing one server cross-collect and cross-ack; teach explicit ids for anything concurrent.
Sources: reviewers B (F2), A (F6).
"""
disposition = "fix-now"
route = "review"
response = """
Observation verified (ack does not change what a named wait returns; DEC-054 makes ack non-read-only), prescription narrowed. DEC-062 binds the help loop to wait, then ack the settled runs received, and the ack has a real use beside a named wait: it keeps used runs out of a later selector-less recovery wait. So sec-5 keeps the ack in the taught loop, and the repair is: the loop exits on what the caller used (with F-5), sec-5 states what the ack is for (recovery) and its cost (one non-read-only call that some clients prompt for), sec-5 states that implicit selection and acknowledgement are per server, not per caller, and help/setup.md and the README client guidance name the tools a prompting client will ask to approve.
"""


[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Acknowledgement fails for terminal runs it should accept; the taught loop can spin"
detail = """
sec-2 ack reasons, sec-3, sec-5 loop, sec-7 implicit(). Two related gaps:
(a) A `lost` record in this server is neither `not-settled` nor `unknown`, and runs.test says ack accepts only settled runs; yet implicit() returns every unacknowledged start run and lost counts as done. One unwritable result.json (ENOSPC) makes every selector-less until:any wait return at once for the server's life.
(b) ack's `unknown` means "no record in this server" while wait's `unknown` means "no record and no evidence directory". A run resolved from disk as settled (after a reconnect = new server) acks `unknown`; the sec-5 loop drops ids only if acknowledged, lost or in w.unknown, so it keeps them and every wait returns the same results at once, forever.
Repair sketch: acknowledgement applies to any terminal record (settled or lost) — DEC-049's "once settled" read as "once terminal"; a disk-resolved run gets a distinct reason (e.g. not-held) or is treated as acknowledged; the loop drops ids the caller has used rather than ids the ack confirmed.
Sources: reviewers B (F1) and C (F5); confirmed from the design text.
"""
disposition = "fix-now"
route = "review"
response = """Both arms verified from the design text. (a) lost postdates DEC-049's "only once settled" (lost came with DEC-066); reading it as "once terminal" keeps DEC-049's purpose — ack removes a run from implicit selection — and removes a permanent spinning target. Repair: ack accepts settled and lost records; not-settled stays for queued, running and foreign. (b) DEC-068 fixes ack's unknown reason for runs this server does not hold, so the reason stays; the defect is the taught loop's exit rule. Repair in sec-5: the loop drops every id it has finished with — settled entries whose result it used, lost entries and unknown ids — whatever ack answered; ack only matters for selector-less waits (see F-6). sec-9: ack of a lost record answers acknowledged true and removes it from implicit(); a loop over disk-resolved settled ids terminates."""


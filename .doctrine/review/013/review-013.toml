[[finding]]
id = "F-15"
status = "verified"
severity = "minor"
title = "sec-7 signatures that cannot be written as given, and ownership leaks"
detail = """
sec-7.
- No callId reaches launch: readmit(admitted, context, callId) and runChild need one; neither Admitted, RunRecord nor Launch carries it. Put callId on Admitted.
- ExecuteDeps.onAudit is per run inside shared deps, so server.ts would write registry state (record.updatedAt). The registry should pass the callback into launch — or drop the plumbing and have lastUpdatedAt follow state transitions only, removing RunControl.onAudit.
- The owner has two sources (createRegistry({owner}) and Admitted.session.owner) though sec-7 says "read once". Use the admitted one.
- Launch returns a bare AgentResult, so the registry cannot tell a re-admission refusal (needs a refused audit record and an attempts line) from a spawn-audit audit-failed. Return { refused } | { result }.
- Unspecified: what happens when the refused, cancelled or dropped audit append itself fails before settle.
- ServeOptions.procDir serves two jobs: acquireSession reads this process's own start time from it (session.ts:536-542) and viewFromDisk checks other servers' liveness. fakeProc(dir,'unreadable') would make every admission refuse session-busy. Split the option, or fakeProc always copies the current pid's stat.
Source: reviewer C (F8, F11), verified for procDir.
"""
disposition = "fix-now"
response = "Accepted. callId goes on Admitted; the registry passes each run's onAudit callback into launch, so server.ts writes no registry state; the owner is read once from Admitted.session.owner and createRegistry loses its owner dependency; Launch answers { refused } or { result }, so the registry writes the refused audit record (the attempts line stays where the refusal is decided: readmit for a re-admission refusal, the registry for lane-predecessor-failed); a failed refused, cancelled or dropped audit append does not stop the settlement (the run settles regardless, and the failure is reported on stderr as every evidence writer does). procDir: fakeProc always stages the current process's own stat line, so admissions work under any staged owner table; one option stays."


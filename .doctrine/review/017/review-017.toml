[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Conformance: src/cli.ts, src/errors.ts, src/root.ts undeclared; src/server/test-rig.ts reported undelivered"
detail = """
Expected: every edited source path matches a design-target selector, and every design-target selector matches an edit.
Observed (`doctrine slice conformance 5`, registry a902e77..b2c183b): undeclared src/cli.ts, src/errors.ts (new), src/root.ts — top-level src files that no design-target selector covers (src/json.ts is listed alone; scope-relevant src/** does not count). The slice scope names `src/**/*.ts`, so these are in scope; the selector set under-declares it.
Undelivered src/server/test-rig.ts: the file was edited (+138/-? lines in the diff) but each path is attributed to one selector, and src/server/** claims it first — the narrower selector is redundant, not undelivered.
"""
disposition = "design-wrong"
response = """
The selector registry under-declares the scope and carries a redundant selector. Reconcile via the registry: `doctrine slice selector add` design-target `src/*.ts` (covers cli.ts, errors.ts, root.ts, json.ts) and `doctrine slice selector rm` the redundant `src/server/test-rig.ts` (subsumed by `src/server/**`). See Reconciliation Brief.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
The selector registry under-declares the scope and carries a redundant selector. Reconcile via the registry: `doctrine slice selector add` design-target `src/*.ts` (covers cli.ts, errors.ts, root.ts, json.ts) and `doctrine slice selector rm` the redundant `src/server/test-rig.ts` (subsumed by `src/server/**`). See Reconciliation Brief.
"""

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "Phase deltas are one shared range and include .doctrine knowledge paths"
detail = """
Expected: one source delta per phase, code only (record-delta: "cumulative code tip (pre-knowledge-record)").
Observed: phases were not committed separately; the implementation landed as one commit b2c183b, which also carries the slice's .doctrine records (design, notes, plan, review 016, IMP-002). All five phases record --start a902e77 --end b2c183b, so conformance lists the 16 .doctrine paths as undeclared and cannot attribute paths to phases.
"""
disposition = "tolerated"
response = """
Rationale: phases ran in one working tree against one start commit without intermediate commits, so per-phase ranges do not exist and cannot be reconstructed truthfully; the .doctrine paths are knowledge records, not source, and are visibly so in the conformance output. Rewriting history to split the commit buys nothing for a closed burn-down. Lesson harvested to notes.md: commit per phase, code before knowledge, when conformance attribution matters.
"""


[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Distinguish crossing-prefix audit values from final drained peak"
detail = "External pi review m-1. Design section 2 correctly specifies prefix equality, while section 4 item 7 leaves audit/live/replay agreement unqualified. Verified src/server/spawn.ts:332-359 keeps observing buffered records and terminate at :403-414 snapshots the tally at trigger time. Subsequent buffered/drained records can increase the final replay peak after the gate stops. Specify crossing-time observed versus end-of-run peak and add a buffered-drain test."
disposition = "fix-now"
route = "review"
response = "Verified snapshot timing issue. Sections 2 and 3 now distinguish crossing-prefix abort observations from the final drained status peak. Section 4 and the section 2 test summary qualify equality by event prefix and require a buffered/drained larger-record case that preserves the original abort value while increasing the final peak."


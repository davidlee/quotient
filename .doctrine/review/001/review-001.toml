[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Label resumed-session event-shape assumptions rather than claim runtime proof"
detail = "External pi review m-2. Design section 2 says the first resumed request measures retained history and section 4 makes it a verification obligation. No exact installed-pi resumed-session trace was collected. The existing assistant message_end counting assumes historical assistant messages are not replayed as fresh sends. This is a distinct event-shape assumption; mark it beside runtime parity and scope fixture evidence accordingly. A live provider probe is not performed by this design review."
disposition = "fix-now"
route = "review"
response = "Accepted the limit on evidence, not a demonstrated replay defect. Sections 2 and 4 explicitly identify the installed-pi resumed-event shape as unverified and qualify fixture evidence as arithmetic only. No source or runtime claim now certifies historical assistant replay behavior. No live provider/session probe was run. Route review settles the unsupported design assertion; this is not an instrument obligation claimed satisfied by prose."


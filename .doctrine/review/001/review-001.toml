[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Specify the retained accounting unmeasured counter by its increment set"
detail = "External pi review M-2. Design section 2 says top-level requests_unmeasured keeps its accounting role without defining that role. Verified src/reduce/reduce.ts:460-464 and :488-494 increment it for summarization_retry_scheduled and failed/aborted sends without observed valid price. Ordinary missing usage instead marks accounting unknown at :471-474 without incrementing the counter. Define this existing behavior explicitly under status/3 and distinguish it from context.requests_unmeasured, including overlap/non-additivity and known-accounting exceptions."
disposition = "fix-now"
route = "review"
response = "Verified ambiguous counter definition. Section 2 now specifies the exact existing top-level increment set, ordinary cost-invalid behavior, each counter bounded by requests, overlap and non-additivity, examples where either count is larger, and known accounting despite tolerated cost gaps. Section 3 requires the active /2 contract to carry those exact definitions. No new top-level counting behavior is introduced."


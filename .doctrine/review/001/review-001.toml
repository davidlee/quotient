[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Make active result contract prose migration obligations explicit"
detail = "External pi review M-1. Existing docs/contract/pi-agent-result-1.md:25-27,55,62,95-96,119-120,134 contain old completion/accounting/cumulative-token/policy-schema wording. Design section 3 already explicitly requires new cost-validity and completion meanings, so there is no current contrary design rule. However its complete-contract instruction does not enumerate all prose/table projections that must change, and src/drift.test.ts cannot validate arbitrary explanatory prose. Clarify the new result contract migration obligations without editing historical /1."
disposition = "fix-now"
route = "review"
response = "The existing design already required cost-only accounting validity and revised completion meanings; it did not prescribe copying the old contradictory prose, so the major-severity claim overstates the defect. Nevertheless section 3 now enumerates the envelope predicate, status accounting and counter descriptions, States and Terminations rows and policy-invalid schema reference, with historical /1 left intact. Verification includes prose semantics as well as drift keys and enum tables."


[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Migration scope omits installed-package and hostile-audit scripts"
detail = "External pi review B-1. Design section 4 code-impact table and release verification omit scripts/pack-check and scripts/hostile-audit. Verified scripts/pack-check:248,252 and scripts/hostile-audit:196,199 generate quotient-policy/1 policies with maxima.tokens. Pack-check:403-408 requires a completed final call, which the new policy/2-only server will refuse. Pack-check:104-118 clones HEAD and tests the installed tarball, not uncommitted source. Add both scripts to migration scope and require the installed-package check on the intended 0.2.0 release commit. Reviewer called this a publish blocker; npm publish does not automatically run pack-check under current package.json, so the claim of an automatic npm hook is not verified."
disposition = "fix-now"
route = "review"
response = "Verified migration omission. Added both scripts to the section 4 impact set and design-target selectors, required scripts/pack-check against the intended committed 0.2.0 release tree, and required explicit installed result/status/context assertions. Clarified that pack-check clones HEAD and is an explicit gate, not an automatic npm publish hook. Updated hostile-audit fixture migration and distinguished its real-provider prerequisite from package stub verification. This repairs design scope; implementation scripts have not been changed or executed."


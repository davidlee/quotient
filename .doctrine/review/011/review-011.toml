[[finding]]
id = "F-32"
status = "verified"
severity = "minor"
title = "a builder-emitted single-quoted literal should remain text; observed: backslash plus backtick is falsely refused"
detail = '''
VERIFIED at HEAD d7ba2b (round 3), a remaining builder-compatibility case after F-24. Evidence: nix/check.sh:208-210 rejects the byte sequence backslash/backtick anywhere, before Bash parses its quoting. nix/form-family.nix:94-99 only refuses $ and newline in env values; :226-230 forwards the other values to jail.nix's shell quoting.

Concrete family, using sampleBase from nix/checks/flake.nix:
  family (sampleBase pkgs // { env.NOTE = "a\\`b"; })
(The Nix source contains two backslashes, so NOTE contains one literal backslash before a backtick.) mkFormFamily evaluates and builds both forms and baseline, including the launcher's ShellCheck. Actual emitted fragment:
  --setenv NOTE 'a\`b'
The built read form is /nix/store/x5bicwn0mwgfwblxz7ldf2acfvxc1hkl-quotient-read/bin/quotient-read. Harmless Bash eval/set -- reads NOTE as exactly a, backslash, backtick, b; no command substitution or escape takes effect within single quotes. shell_words instead returns 1, 'an escaped backtick', so the complete family fails (e) baseline and (c) read/write. Reproduced as r3-backslash-backtick in /nix/store/f5cm06s2dqj22j6b9aj82m4d6hwywspi-check-fixtures (118/118, including the expected false refusal).

DEC-029 Amendment 2 item 4 currently describes this blanket refusal; this finding is the requested builder/checker mismatch, not a claim that the implementation omitted that blanket rule. Repair the quote-blind prefilter so a backslash/backtick inside a single-quoted literal remains ordinary text, or make the builder reject this input at evaluation with a named, documented limit. Add the actual builder-emitted family as a regression.'''
disposition = "tolerated"
response = '''DEC-029 Amendment 2 item 4 refuses \` anywhere as a deliberate cost, like the escaped operators the first amendment already refuses: inside double quotes it is a backtick the inert byte cannot stand for, and the quote-blind prefilter is what keeps the parser simple. It fails closed, the input (a backslash before a backtick in an env value) is exotic, and docs/nix-forms.md's plain-words bullet already lists \` as refused.'''

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "tolerated"
response = '''DEC-029 Amendment 2 item 4 refuses \` anywhere as a deliberate cost, like the escaped operators the first amendment already refuses: inside double quotes it is a backtick the inert byte cannot stand for, and the quote-blind prefilter is what keeps the parser simple. It fails closed, the input (a backslash before a backtick in an env value) is exotic, and docs/nix-forms.md's plain-words bullet already lists \` as refused.'''

[[finding.turn]]

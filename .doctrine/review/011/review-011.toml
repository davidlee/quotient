[[finding]]
id = "F-31"
status = "verified"
severity = "major"
title = "mount comparisons should account for symlink traversal; observed: an explicit symlink redirects an accepted bind onto /tmp"
detail = """
VERIFIED at HEAD d7ba2b (round 3), a remaining kernel-path gap after F-19/F-22's lexical canonicalization fixes. Evidence: nix/check.sh:375-405 removes . and .. lexically; :464-475 reads each destination independently, without applying --symlink records or following intermediate symlinks. Thus :808-810's /tmp comparison misses a mount whose effective destination is /tmp.

Exact bwrap fragment:
  --dir /tmp/work --symlink /tmp /tmp/work/alias --ro-bind /etc /tmp/work/alias/.
Add it after '--clearenv' in all three default-family launchers, keeping the normal --tmpfs /tmp and the form tails. The complete family is ACCEPTED (r3-symlink-target in /nix/store/bz47kmsr8g8zjvnds6vlpfva77jyhkzi-check-fixtures; 115/115). mounts reports --dir /tmp/work, --symlink /tmp/work/alias, --ro-bind /tmp/work/alias; protected_aliases and climbing_mounts emit nothing. Rule (d) reads exactly one /tmp mount.

Verified runtime reproduction with bwrap 0.12.0:
  bwrap --ro-bind / / --tmpfs /tmp --dir /tmp/work --symlink /tmp /tmp/work/alias --ro-bind /etc /tmp/work/alias/. -- /run/current-system/sw/bin/bash -c 'if test -f /tmp/passwd; then echo intermediate-symlink-target-mounted-at-/tmp; fi'
It exits 0 and prints intermediate-symlink-target-mounted-at-/tmp: the bind replaces /tmp with host /etc. A control using final destination /tmp/work/alias without '/.' fails with "Can't mount on symlink destination", but '/.' traverses the symlink as an intermediate component and succeeds. The path and redirecting symlink are both in the checked argv; no host symlink, variable expansion or caller runtime bind is needed.

Repair: track explicit symlink effects in destination resolution or conservatively refuse mounts traversing such aliases. Do not treat lexical removal of . or .. as kernel resolution in the presence of symlinks. Cover the intermediate-component '/.' case, not only a final symlink."""
disposition = "fix-now"
response = "Fix: a mount whose path lies at or under the destination of an earlier --symlink on the line (as canonical_target resolves both) is refused under (c), the conservative arm the raiser offers. Host symlinks inside bound trees stay a runtime residue (design brief). Regression: the raiser's /tmp/work/alias/. fragment."


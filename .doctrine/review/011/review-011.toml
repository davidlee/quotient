[[finding]]
id = "F-34"
status = "verified"
severity = "minor"
title = "builder and checker should agree on literal control bytes; observed: a carriage-return env value builds but is falsely refused"
detail = '''
VERIFIED at HEAD d7ba2b (round 3). Evidence: nix/form-family.nix:94-99 rejects only $ and LF in env values, whereas nix/check.sh:222-224 rejects bytes 001-010 and 013-037 in the entire launcher line, including safely single-quoted literal data.

Concrete family (Nix source):
  family (sampleBase pkgs // { env.NOTE = "a\rb"; })
This evaluates and builds both forms and baseline, including ShellCheck. Actual emitted bytes are --setenv NOTE 'a<CR>b' (CR is hex 0d, not LF). A harmless Bash eval/set -- reproduction reads the NOTE operand with bytes 61 0d 62, exactly what the builder emits. shell_words returns 1, 'a control byte'; the family is refused as (e) baseline and (c) read/write. Built read form: /nix/store/ca6hdg2q8f9nimh078gsz452rhkrv929-quotient-read/bin/quotient-read. Scratch fixture r3-carriage-return verifies the full failure in /nix/store/f5cm06s2dqj22j6b9aj82m4d6hwywspi-check-fixtures (118/118).

DEC-029 intentionally reserves control bytes from the parser; this is a builder/checker input-contract mismatch, not a suggestion to let reserved delimiter bytes into its record format. Repair: reject reserved bytes in the builder's accepted values/paths at evaluation with a named diagnostic, or redesign the encoding to preserve such literal data. Cover at least CR so the existing LF check is not mistaken for the complete emitted-text limit.'''

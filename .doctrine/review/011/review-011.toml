Concrete fixture: on the default family, in launcher-read, launcher-write and baseline, replace '--clearenv' with '--clearenv --ro-bind /etc tmp'. The checker ACCEPTS (r3-relative-target in /nix/store/bz47kmsr8g8zjvnds6vlpfva77jyhkzi-check-fixtures; 115/115). Its mount records report --ro-bind target 'tmp', so (d) sees only the existing --tmpfs /tmp; bind-set equality and (j) also pass.

Runtime reproduction, harmless and verified with bwrap 0.12.0:
  bwrap --ro-bind / / --tmpfs /tmp --ro-bind /etc tmp -- /run/current-system/sw/bin/bash -c 'if test -f /tmp/passwd; then echo relative-target-mounted-at-/tmp; fi'
It exits 0 and prints relative-target-mounted-at-/tmp. The effective mount is a second mount at /tmp, replacing its tmpfs with host /etc, although the rule read a different target. This is not a variable expansion or an unknown literal real-home path.

Repair: use separate source and destination path semantics. Resolve ordinary relative destinations against bwrap's new root (or refuse them), rather than assigning their first component a symbolic anchor. Ordinary relative sources also need refusal or an explicitly unresolved treatment instead of claiming kernel resolution. Add tmp and ./tmp target regressions."""
disposition = "fix-now"
response = "Fix: a mount path operand must be absolute or begin with a symbol the check names (unquoted ~, or a $-variable); an ordinary relative path is refused under (c). Regressions: tmp and ./tmp targets, a relative source."


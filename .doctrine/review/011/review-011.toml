[[finding]]
id = "F-33"
status = "verified"
severity = "minor"
title = "newline limits should cover text mkFormFamily emits; observed: a piFiles key builds a launcher the checker cannot read"
detail = '''
VERIFIED at HEAD d7ba2b (round 3), an uncovered emitted-text case adjacent to F-25's newline refusal fix. Evidence: nix/form-family.nix:49-50 admits a piFiles key containing a newline; :94-99 newlineValues covers env and hostPaths, excluding piFiles keys; :219-221 emits the escaped key on the bwrap line. nix/check.sh:193 extracts one physical line, so shell_words (:238-240) sees an unclosed single quote.

Concrete family (Nix source):
  family (sampleBase pkgs // {
    piFiles."first\nsecond" = pkgs.writeText "newline-key" "hi";
  })
It evaluates and builds both forms and baseline without an evaluation refusal or ShellCheck failure. Actual launcher bytes include:
  --ro-bind /nix/store/zg8raz475kr6xnq535ap06vz9y27w7cm-newline-key ~/.pi/agent/'first<LF>second'
Bash reads a single target argument containing the newline. The checker returns 1 with 'the bwrap line is not plain words: quoting that does not close' for (e) baseline and (c) read/write, exactly the misleading downstream failure F-25 was intended to move to evaluation. Built read form: /nix/store/9m7mn18w7ldwmm7bc7sdjvjiw8d4dijs-quotient-read/bin/quotient-read. Scratch fixture r3-pifile-newline confirms the complete-family refusal in /nix/store/f5cm06s2dqj22j6b9aj82m4d6hwywspi-check-fixtures (118/118).

Repair: given the chosen one-physical-line/one-word-per-line design, extend the evaluation-time named newline refusal to piFiles keys (or explicitly support this emitted shape). Add the builder input and exact diagnostic to the evaluation-refusal corpus.'''

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Deferred-bind negative control contradicts the tail ordering"
detail = "sec-2 says the builder tail follows caller defers; sec-3 lists a deferred bind over the root as a control that must fail the check. If the tail is last, that control passes the check and the neg derivation turns the gate red. Controls name no expected label."
disposition = "fix-now"
route = "control"
response = "Integrated: verified the tail is the last deferred permission (jail.nix composes s.deferredPermissions in push order, lib/jail.nix:57-60), so a caller deferred bind cannot follow it. That control is replaced by a doctored launcher with a bind moved after the session bind (trips the positional rule). sec-3 now names each control's expected label in a table."


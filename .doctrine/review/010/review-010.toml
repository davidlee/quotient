[[finding]]
id = "F-5"
status = "answered"
severity = "major"
title = "LANG/TERM defaults cannot override base fwd-env; HOME has no fallback"
detail = 'Claimed: base emits --setenv LANG "$LANG" at step 1, a later --setenv cannot stop its expansion under set -u. HOME is load-bearing with no fallback.'
disposition = "fix-now"
route = "demonstrate"
response = "Contested in part. set-env writes a map (set-env.nix: env = state.env // { name = ...; }) and jail.nix emits one --setenv per name at finalisation, so the builder's set-env replaces base's fwd-env; satan's built launcher shows a single --setenv TERM xterm-256color, its override. HOME: accepted as a precondition: the server's environment has HOME (its own XDG paths derive from it); the launcher fails closed (G9) without it. sec-2 now states that, and why the override works."


[[finding]]
id = "F-14"
status = "answered"
severity = "major"
title = "Exposure inside the root under read makes part of the root writable (G2)"
detail = "The refusal covers exposure equal to or containing the root only; an exposure inside the root under read is a writable subtree of a read-only root, and the probe asserted it writable."
disposition = "fix-now"
route = "probe"
response = "Revised (see F-17): G5 is a ceiling ('can write nothing except ... exposure'), not a promise that every exposure path is writable. Exposure binds now precede the root bind, so under read the root's ro bind covers any exposure inside the root and G2 holds with no refusal. Under write an exposure bind and the root bind show the same host directory. The probe asserts P/root/out is refused under read and writable under write."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "probe"
response = "Integrated: G2 is literal ('the root is not writable under a read profile'), so under read the launcher refuses any exposure path that overlaps the root (equal, containing, or inside), before bwrap. Under write an exposure inside the root is bound at its own path and changes nothing. The probe runs its read assertions from a second root with no overlap, and asserts that a read launch from P/root, which contains P/root/out, is refused. DEC-017 and DEC-022 amended."

[[finding.turn]]

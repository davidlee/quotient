[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "State mask and protect fail the launch when the target is missing under a ro bind"
detail = "bwrap cannot create a tmpfs mount point inside a read-only bind (verified, bwrap 0.12.0: Can't create file ... Read-only file system). A protect path, or the default quotient state dir under a policy that moved it, that is absent on the host and sits under a caller ro bind makes every launch fail. The probe pre-creates every target so cannot see it."
disposition = "fix-now"
route = "probe"
response = "Integrated: the launcher builds the mask list at launch and masks only paths that exist on the host (a missing path has nothing to reveal; verified the conditional form launches). Emitted as a builder-owned array expansion in the tail, not RUNTIME_ARGS (which jail.nix appends after every static argument). Probe gains a protect path that does not exist under a ro caller bind; launch must succeed. Root and session targets always exist on the host, so the ro-ancestor case for them binds over an existing directory."

[[finding.turn]]
act = "raise"
role = "raiser"


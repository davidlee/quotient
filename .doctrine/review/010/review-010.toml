[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Verification table overclaims G7 and a vacuous /nix/store case"
detail = "The probe has no G7 assertion (only text in (d)); /nix/store is read-only on the host regardless of the jail, so refusing it proves nothing."
disposition = "fix-now"
route = "control"
response = "Contest upheld on evidence. form-1 G7 is 'the confined process dies with its parent', and the server is the form's parent. The form execs the launcher, which execs env -i, which execs bwrap, so the form process becomes bwrap, and bwrap's parent is the form's parent. Observed 2026-10-24 (bwrap 0.12.0, this host): bwrap --die-with-parent started under a sh parent; SIGKILL to that sh removed bwrap and its jailed sleep within 1 s. Killing the form itself is the server's SIGTERM/SIGKILL ladder, a different property. The G7 probe stays as designed; sec-5 now says why the parent is the right target."


# Implementation plan for SL-004 — the authored, durable phase plan.
#
# Single source of each phase's objective, criteria, verification and links.
# Runtime status lives under .doctrine/state/ — never record progress here.
# Ids (PHASE-NN, EN-/EX-/VT-/VA-/VH-n) are immutable: edits append, never renumber.
# "sec-N" is a section of .doctrine/slice/004/design.md (locked, rev 72).
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-004"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Evidence foundations"
objective = "evidence.ts gains everything a run on disk needs — result.json in the layout, RUN_NAME_GRAMMAR, layoutFor, appendAudit returning its ts and starting each record on a fresh line, writeResult (temp + rename), readResult (found / absent / unreadable), readAudit (records + torn flag), the five new audit kinds — and result.ts gains the lane-predecessor-failed reason. spawn.ts's observe contains a throwing record and RunControl gains onAudit. No server behaviour changes."
entrance_criteria = [
  { id = "EN-1", text = "Plan approved. Read sec-3 (The handle; Resolving a handle — the three readResult outcomes, torn lines) and sec-7 (`evidence.ts`, `spawn.ts` and `result.ts`); DEC-049, DEC-066." },
  { id = "EN-2", text = "Baseline: `just gate` green on the commit this phase starts from; per-file lint error counts for the files this phase touches match the baseline in notes.md § Plan baselines." },
]
exit_criteria = [
  { id = "EX-1", text = "First red: the new src/server/evidence.test.ts fails on the absent writeResult/readResult/readAudit/layoutFor/RUN_NAME_GRAMMAR before they exist. Record the red in the phase sheet." },
  { id = "EX-2", text = "evidence.ts per sec-7: RUN_EVIDENCE_FILES and RunLayout gain `result`; RUN_NAME_GRAMMAR exported beside runName; layoutFor(runDir, run), with runLayout(runDir, callId) defined as layoutFor(runDir, runName(callId)); AuditKind gains admitted, refused, cancelled, dropped, lost. childview.test.ts:362 expects the six evidence files (moved here from PHASE-07: it pins RUN_EVIDENCE_FILES)." },
  { id = "EX-3", text = "appendAudit returns the ts it wrote, or null on failure; when the file is non-empty and does not end in a newline it writes a newline before the record in the same write. Every existing caller that tested `true`/`false` tests `null` instead, with unchanged behaviour." },
  { id = "EX-4", text = "writeResult writes pretty-printed JSON to `<dir>/.result.json.tmp`, reads its mtime, renames onto result.json and returns that time; on failure before the rename it removes the temp file, reports on stderr and returns null. readResult answers found only for a file that parses and passes validateAgentResult, absent only for ENOENT, unreadable otherwise. readAudit answers null when the file cannot be read, else { records, torn } skipping and reporting unparseable lines." },
  { id = "EX-5", text = "result.ts: RESULT_REFUSAL_REASONS gains `lane-predecessor-failed`; REACHABILITY's text names the new producers (eof and cancelled settle queued runs without a process; refused is also a run settled at launch). result.test.ts's reason and reachability tables pass. docs/contract/pi-agent-result-2.md's Refusals table gains the `lane-predecessor-failed` row (when it is produced: a laned run with needs_success whose predecessor did not complete), so drift.test.ts's refusal-token equality holds; the rest of that contract's changes stay in PHASE-10." },
  { id = "EX-8", text = "Reducer guard (design sec-7 spawn.ts bullet, amended 2026-10-26): one shared predicate rejects a parsed line that is not a non-null, non-array object; reduce.ts tests it before `records += 1` and countRecord, counting the line malformed; observe uses the same predicate before countRecord. pi-agent-result-2.md's malformed row says \"lines that were not a JSON object\" and records counts objects only. reduce.ts gains no lint errors over its baseline." },
  { id = "EX-6", text = "spawn.ts: observe treats a record whose handling throws as malformed (reported on stderr); RunControl gains optional onAudit(ts), called by runChild's audit wrapper for every record appended. runChild still calls removeRun in this phase (moved in PHASE-07)." },
  { id = "EX-7", text = "`just gate` green. src/server/evidence.test.ts and src/server/evidence.ts lint clean (`npx eslint <file> --max-warnings 0`); spawn.ts, result.ts and their tests gain no lint errors over the baseline." },
]
verification = [
  { id = "VT-1", expects = "evidence.test.ts: appendAudit ts/null and fresh-line after a torn line; readAudit flags the torn line and returns the record after it; readResult's three outcomes, an invalid document unreadable; writeResult leaves no result.json or a whole one, cleans its temp file and returns null on failure; RUN_NAME_GRAMMAR accepts minted names and refuses `..`, `/`; layoutFor and runLayout agree.", test_file = "src/server/evidence.test.ts", keywords = ["appendAudit", "readAudit", "torn", "readResult", "'absent'", "'unreadable'", "writeResult", ".result.json.tmp", "RUN_NAME_GRAMMAR", "layoutFor"], waived = false },
  { id = "VT-2", expects = "spawn.test.ts: a child printing the JSON line `null` and other non-object lines finishes and settles normally with the line counted malformed; onAudit receives the ts of each record appended.", test_file = "src/server/spawn.test.ts", keywords = ["onAudit", "malformed", "'null'"], waived = false },
  { id = "VT-3", expects = "result.test.ts covers the new refusal reason through its RESULT_REFUSAL_REASONS loop and names it.", test_file = "src/server/result.test.ts", keywords = ["lane-predecessor-failed", "RESULT_REFUSAL_REASONS"], waived = false },
  { id = "VT-5", expects = "reduce.test.ts: null, boolean, number, string and array lines are malformed, not records, accounting unchanged; {} and an unknown object are records; live tally equals the reduction.", test_file = "src/reduce/reduce.test.ts", keywords = ["'null'", "'true'", "'[]'", "malformed", "records", "'{}'"], waived = false },
  { id = "VT-4", expects = "The contract's Refusals table lists the new reason.", test_file = "docs/contract/pi-agent-result-2.md", keywords = ["lane-predecessor-failed"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Run owner identity and liveness"
objective = "session.ts's acquisition carries owner { pid, starttime, boot, pidns, host }, with boot id, pid-namespace id (kept only when this process's NSpid line has one field) and hostname read once at start-up and passed in; ownerLiveness(procDir, here, owner) applies sec-3's rule. fakeProc moves from session.test.ts into test-rig.ts so later suites share it. Session-lock liveness is unchanged (RSK-003)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 exits hold. Read sec-3 (Start step 4; Resolving a handle — the ownerLiveness bullet and `lost` evidence) and sec-7 `admission.ts`'s session.ts paragraph; DEC-067, RSK-003." },
  { id = "EN-2", text = "Host confirmation (plan constraint, slice notes § Further review passes): on this host, from Node, /proc/self/status has an NSpid line, /proc/sys/kernel/random/boot_id and the /proc/self/ns/pid link are readable, and NSpid has one field with the process's own /proc and more than one when /proc belongs to an ancestor namespace (`unshare --user --pid --fork` without --mount-proc). Re-run the probe recorded in notes.md § Plan baselines and record its output in the phase sheet; any difference stops the phase for /consult." },
]
exit_criteria = [
  { id = "EX-1", text = "First red: session.test.ts cases for owner and ownerLiveness fail before the code exists. Record the red in the phase sheet." },
  { id = "EX-2", text = "A pure start-up reader of the host identity (boot, pidns, host; each null when unreadable; pidns null unless NSpid has exactly one field, null when the line is missing) over procDir, and acquireSession's ok arm gains `owner` built from it plus the pid and starttime the lock already reads. No existing acquireSession caller changes behaviour." },
  { id = "EX-3", text = "ownerLiveness(procDir, here, owner): same host, boot and non-null matching pidns → observeLiveness(pid, starttime); same host, different boot → stale; any other combination, or any identity component null on either side → unknown." },
  { id = "EX-4", text = "test-rig.ts exports fakeProc(dir, { pid, starttime, boot?, pidns?, nspid? } | 'unreadable'): a readable table always carries this process's own stat line and a self/status whose NSpid has one field unless `nspid` stages several. session.test.ts uses it in place of its inline fixture, with its existing cases unchanged in outcome." },
  { id = "EX-5", text = "`just gate` green; session.ts, session.test.ts and test-rig.ts gain no lint errors over the baseline, and every function added lints clean." },
]
verification = [
  { id = "VT-1", expects = "session.test.ts: owner is this pid, its lock's starttime and the start-up identity (each null when unreadable; pidns null for a multi-field or missing NSpid); ownerLiveness over every row of sec-3's rule.", test_file = "src/server/session.test.ts", keywords = ["ownerLiveness", "owner", "fakeProc", "nspid", "boot"], waived = false },
  { id = "VT-2", expects = "fakeProc is a shared helper.", test_file = "src/server/test-rig.ts", keywords = ["export function fakeProc", "nspid"], waived = false },
  { id = "VA-1", expects = "EN-2's host probe output is recorded in the phase sheet and matches notes.md § Plan baselines." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Extract callTool"
objective = "Behaviour-preserving move: callTool's request reading moves to tools.ts, admission steps 1–8 and the ledger probe to admission.ts (admit over private authorise and checkLaunchable), the run tail to execute.ts (executeRun), and toolResult to documents.ts. server.ts's tools/call arm becomes readToolCall → admit → executeRun → release, with every current test passing unchanged. Satisfies IMP-004."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 exits hold. Read sec-7 (the move-don't-copy rule; `tools.ts`, `admission.ts`, `execute.ts`; the `server.ts` start-up-refused paragraph) and IMP-004. Read server.ts callTool (lines 257–490) and its reply arm in full before moving it." },
]
exit_criteria = [
  { id = "EX-1", text = "Refactor under the existing net: server.test.ts, spawn.test.ts, gate.test.ts and childview.test.ts pass before and after with no change but import lines (moved symbols); the only new test file is admission.test.ts." },
  { id = "EX-2", text = "tools.ts holds PI_AGENT_TOOL, AgentRequest and readAgentRequest, moved from server.ts with no new arguments yet (lane, needs_success, key land in PHASE-08). server.ts re-exports nothing it moved; importers are updated." },
  { id = "EX-3", text = "admission.ts exports Admitted, Refused, AdmissionContext and admit(request, context, callId) per sec-7; every refusal is appended to attempts.jsonl where it is decided, as today; admit releases the session on any refusal after it acquires it. authorise takes an explicit profile name, root, requested ceilings and requested tools, so PHASE-08's readmit reuses it." },
  { id = "EX-4", text = "execute.ts exports ExecuteDeps and executeRun(admitted, layout, controller, onAudit, deps) holding callTool's tail from the gate onwards; it never throws (an exception becomes failedResult('error', …)) and does not release the session — server.ts releases it in a finally, as today. The layout is still allocated by the server in this phase. EMPTY_STATUS names today's `reduce([], {}).status`." },
  { id = "EX-5", text = "documents.ts holds toolResult, moved from server.ts." },
  { id = "EX-6", text = "admission.test.ts: admit refuses at each step with the reason callTool gave and releases the session on a refusal after step 7, driven through admit directly." },
  { id = "EX-7", text = "`just gate` green. tools.ts, admission.ts, execute.ts, documents.ts and admission.test.ts lint clean (moved code is brought to zero errors as it moves); server.ts gains no lint errors over the baseline." },
]
verification = [
  { id = "VT-1", expects = "admission.test.ts: admit refuses at each of steps 1–8 as callTool did, and releases the session after a refusal following step 7.", test_file = "src/server/admission.test.ts", keywords = ["admit(", "release", "session-invalid", "session-busy"], waived = false },
  { id = "VT-2", expects = "admit and its two private steps exist in admission.ts.", test_file = "src/server/admission.ts", keywords = ["export function admit", "function authorise", "function checkLaunchable"], waived = false },
  { id = "VT-3", expects = "executeRun holds the tail.", test_file = "src/server/execute.ts", keywords = ["export function executeRun", "createGate", "runChild", "resultFor", "EMPTY_STATUS"], waived = false },
  { id = "VA-1", expects = "The diff shows moves, not copies: no second implementation of any admission step, of readAgentRequest or of toolResult remains in server.ts (`git diff --stat` plus a grep of the moved function names, recorded in the phase sheet)." },
]
specs        = []
requirements = []


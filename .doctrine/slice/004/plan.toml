[[phase]]
id        = "PHASE-07"
name      = "Blocking pi_agent through the registry"
objective = "Legacy blocking pi_agent becomes start plus wait in-process: tools/call admits, registry.start publishes (admitted record first, result.json at commit) and the call answers the commit's document. runChild no longer discards a published directory. notifications/cancelled silences its request's reply; EOF sets closed and registry.closing() at the trigger and awaits registry.close(). The regression net holds, with sec-9's four deliberate changes rewritten — except tools/list, which changes in PHASE-08."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 exits hold. Read sec-3 (Start; the publication line; Launch and the run task), sec-6 (notifications/cancelled; Client EOF), sec-7 `server.ts` and `execute.ts`, sec-9 The regression net; DEC-053, DEC-064, DEC-066." },
]
exit_criteria = [
  { id = "EX-1", text = "Context gains registry, procDir and admission (AdmissionContext); ServeOptions gains procDir (default /proc) and pollMs. launch is executeRun for a run that was never queued (readmit lands in PHASE-08)." },
  { id = "EX-2", text = "pi_agent's handler is admitAndStart(request, 'blocking', call) answering the document promise; a call abort with reason `cancelled` becomes registry.cancel([run]); `eof` is left to registry.close(). The layout is minted at publish only; runChild no longer calls removeRun, and a failed spawn record settles an audit-failed refusal into result.json and appends audit-failed to attempts.jsonl." },
  { id = "EX-3", text = "Reply gate: InFlightCall gains silenced, set by abortNamed before it aborts; the answer and catch sites become one answer(call, result) checking !closed && !silenced. The catch arm's refusal no longer claims nothing ran after the publication line." },
  { id = "EX-4", text = "EOF: closed = true and registry.closing() from the signal's abort listener and the input's end and error events; after the loop unwinds, abort in-flight calls, await registry.close(), await every call's done." },
  { id = "EX-5", text = "Regression net per sec-9: every server.test.ts and serve-driven spawn.test.ts case keeps its outcome. Rewritten, not deleted: the cancellation cases assert no reply and result.json `cancelled`; spawn.test.ts:638-672 exercises the publish failure (audit-failed in attempts.jsonl, no directory) and a new case the spawn-record failure (directory kept, result.json refusal, detail no longer says discarded); the first-record and record-order cases (server.test.ts:198-201, 351-352; spawn.test.ts:280, 710-713, 814-817, 930-933, 986-989; gate.test.ts:551) expect `admitted` first, and so do profiles.test.ts:555-561 and help.test.ts:447-448, which read spawn metadata from audit[0] (they find the spawn record instead). spawn.test.ts:680-690, which calls runChild directly, now asserts the directory stays after a failed spawn record. Each rewritten case is listed in the phase sheet with its before/after assertion." },
  { id = "EX-6", text = "test-rig.ts gains resultJson(runDir, run) and auditKinds(runDir, run). New server.test.ts cases: a reply already written before a notification stands; a handler that throws after its call was silenced writes no reply; EOF writes no replies, every run has a result.json, no child outlives serve." },

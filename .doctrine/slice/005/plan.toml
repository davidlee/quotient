]
verification = [
  { id = "VT-1", expects = "The suite passes under the new typing.", test_file = "src/server/test-rig.ts", keywords = ["resultDocument"], waived = false },
  { id = "VA-1", expects = "Diff scan (design sec-2 D4): no new `as`, non-null `!`, `any`, or `eslint-disable` without a one-rule reason; every rewritten truthiness test reviewed for 0 / empty-string semantics; findings recorded in the phase sheet." },
]

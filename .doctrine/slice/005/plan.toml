entrance_criteria = [
  { id = "EN-1", text = "Previous phase exits hold (PHASE-01: design locked). `just gate` green on the starting commit; per-file counts match research/lint-baseline.tsv as ratcheted by the previous phase." },
]
exit_criteria = [
  { id = "EX-1", text = "Every file matching src/**/*.test.ts lints clean." },

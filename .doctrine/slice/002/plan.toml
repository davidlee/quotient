  { id = "VT-2", expects = "Help tests: rendered help and client snippet name XDG layers only and describe project forms.", test_file = "src/help/help.test.ts", keywords = ["XDG", "forms"], waived = false },
  { id = "VA-1", expects = "Walk the sec-3 documentation checklist (EX-1..EX-3) row by row against the diff; record each row's outcome in the phase sheet." },

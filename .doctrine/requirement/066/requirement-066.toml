description = "The flake's `lib.mkFormFamily` builds, from the operator's nixpkgs, jail.nix and pi, a read form and a write form on Linux whose builder-side launchers meet the form contract, plus a comparison baseline, and reports the `exposure` list the policy must carry. Runtime options the operator adds are not checked and are the operator's to keep within the contract."
tags = []
acceptance_criteria = [
  "A family built from the documented minimal consumer yields `read`, `write` and `baseline` executables.",
  "The family exposes the read-write paths it binds as `exposure`.",
  "The builder fails at evaluation on a platform without bubblewrap.",
]

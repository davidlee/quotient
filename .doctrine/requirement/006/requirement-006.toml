description = "Each run is bounded by operator maxima on requests, per-request context, cost and wall clock; a caller may ask for tighter limits for one run but never looser ones."
tags = []
acceptance_criteria = [
  "A caller limit above an operator maximum is refused, not clamped.",
  "A run that crosses a limit is stopped and settles with that limit as its cause.",
  "The wall clock stops a run that has gone quiet.",
]

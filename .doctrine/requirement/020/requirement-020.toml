description = "pi_agent_start with a key the server holds answers the original run's handle when the normalised request digest is equal, and refuses request-invalid when it differs; a key is recorded only when its start publishes a run."
tags = []
acceptance_criteria = [
  "A start retried with the same key and arguments answers the same taskId and admits nothing.",
  "The same key with different arguments is refused request-invalid.",
  "A refused keyed start records no key, so its retry is admitted afresh.",
]

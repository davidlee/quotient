description = "pi_agent_wait selects targets by runs and/or lanes (implicit selections take only unacknowledged pi_agent_start runs), blocks until all or any are done or a timeout passes (default 45 s, capped at the policy's wall-clock maximum or 900 s), and includes results within budget_bytes, the first readable settled result always whole."
tags = []
acceptance_criteria = [
  "timed_out is computed from the same states the entries report.",
  "A result that alone exceeds the budget is included when it is the first readable settled result.",
  "A run started by pi_agent is never an implicit wait target, but is reported when named.",
]

description = "The server launches a confined run as `<form> <session-dir> <pi argv\u2026>` with the canonical root as working directory, pi's argv verbatim (no executable word, no `--`), the prompt on stdin closed after writing, and pi's event stream on stdout."
tags = []
acceptance_criteria = [
  "A confined launch passes exactly the session directory followed by pi's argv to the form.",
  "The form's working directory is the run's canonical root.",
  "stdout and stderr are captured separately and never merged.",
]

description = "The server starts each form as the leader of a new process group and stops it only by signalling that group through the one termination ladder, so signals reach every process that stays in the group and nothing outside it. form-1 does not yet require a form to keep its processes in the group (ISS-004)."
tags = []
acceptance_criteria = [
  "A launched form is a process-group leader distinct from the server's group.",
  "Cancellation, shutdown and limit breaches signal the form's group, never the server's.",
]

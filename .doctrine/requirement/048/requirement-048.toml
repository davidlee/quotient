id = 48
slug = "one-exit-code-convention-across-verbs"
title = "One exit-code convention across verbs"
status = "pending"
kind = "quality"

# description — the requirement statement (structured, queryable; `show` renders
# it as the statement line — the storage rule forbids deriving it from prose).
# Rationale and extended discussion stay in the sister `.md`. Add as:
#   description = "…"
description = "Every verb exits 0 when it did its job, 1 when it ran but could not (or, for reduce, the run did not complete), and 2 for a malformed invocation with usage on stderr; an unknown verb exits 2 with empty stdout."
tags = []
acceptance_criteria = [
  "An unknown verb (including `serve` and `-x`) prints the top-level usage on stderr, nothing on stdout, and exits 2.",
  "`allow` and `revoke` usage errors exit 2 with that verb's own usage; refusals exit 1 naming why.",
  "`reduce` exits 0 for a completed stream, 1 for a failed or incomplete one, 2 for bad flags or unreadable input.",
  "`help` exits 2 for an unknown section and 1 for an unreadable help layer.",
]
